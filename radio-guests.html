<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>라디오 출연자</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#16181d;--sub:#6b7280;--line:#e5e7eb;--acc:#2563eb;--warn:#d97706;--hot:#e11d48;--chip:#eef1f6}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--ink:#eceef2;--sub:#9aa1ad;--line:#2a2f38;--acc:#60a5fa;--warn:#fbbf24;--hot:#fb7185;--chip:#222730}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 12px 8px}
.top{display:flex;align-items:center;gap:8px}
.top h1{font-size:18px;margin:0;flex:1}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
.status{font-size:12px;color:var(--sub);margin-top:4px;min-height:16px}
.days{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:10px;padding:6px 10px;text-align:center;cursor:pointer;min-width:58px}
.day b{display:block;font-size:14px}.day small{font-size:11px;color:var(--sub)}
.day.on{background:var(--acc);border-color:var(--acc);color:#fff}.day.on small{color:#e0e7ff}
.day.empty{opacity:.45}.day.warn{border-color:var(--warn)}
main{max-width:760px;margin:0 auto;padding:12px}
.prog{margin-bottom:18px}
.ph{display:flex;align-items:baseline;gap:8px;margin:0 2px 8px}
.ph h2{font-size:16px;margin:0}.ph .t{font-size:12px;color:var(--sub)}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;color:#fff;background:var(--hot)}
.tag.yt{background:#dc2626}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:#000}
.slides img{flex:0 0 100%;width:100%;max-height:78vh;object-fit:contain;scroll-snap-align:center;display:block}
.slides iframe{width:100%;height:640px;border:0;background:#fff}
.cnt{font-size:11px;color:var(--sub);padding:6px 10px 0}
.cap{padding:8px 10px;font-size:13px;white-space:pre-wrap;color:var(--sub);max-height:4.6em;overflow:hidden;cursor:pointer}
.cap.open{max-height:none}
.act{display:flex;gap:6px;padding:0 10px 10px;flex-wrap:wrap}
.act a,.act button{font-size:12px}
a{color:var(--acc)}
.none{color:var(--sub);text-align:center;padding:40px 0}
.side{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:16px;font-size:13px}
.side h3{margin:0 0 8px;font-size:14px}
.side table{width:100%;border-collapse:collapse}.side td{padding:4px 2px;border-top:1px solid var(--line)}
.bad{color:var(--hot)}
</style>
</head>
<body>
<header>
  <div class="top"><h1>라디오 출연자</h1><button class="btn" id="reload">새로고침</button><button class="btn" id="info">설정</button></div>
  <div class="status" id="status"></div>
  <div class="days" id="days"></div>
</header>
<main id="main"></main>

<script>
/* ===== 프로그램 목록: 여기에 추가하면 됩니다 (slug = programs.sbs.co.kr/radio/○○○) ===== */
const PROGRAMS = [
  {slug:'0chulpowerfm',    name:'김영철의 파워FM'},
  {slug:'cinetown11',      name:'박하선의 씨네타운'},
  {slug:'sbsbigmoney',     name:'박연미의 목돈연구소', igOnly:'mokdo_n'},
  {slug:'sbs12n',          name:'12시엔 주현영'},
  {slug:'cultwoshow',      name:'두시탈출 컬투쇼'},
  {slug:'kingcastlepower', name:'황제성의 황제파워'},
  {slug:'auditionlife',    name:'인생은 오디션', igOnly:'audition1035'},
  {slug:'lovegame',        name:'박소현의 러브게임'},
  {slug:'sbshungry',       name:'유민상의 배고픈 라디오'},
  {slug:'wind',            name:'6시 저녁바람 김창완입니다', igOnly:'windchang1035'},
  {slug:'wendy0s',         name:'웬디의 영스트리트'},
  {slug:'ten',             name:'배성재의 텐', youtube:'https://www.youtube.com/@Bae_ten/posts'},
];
const DAYS_AHEAD = 13;      // 오늘 포함 2주
const LOOKBACK_DAYS = 21;   // 이 기간 안에 올라온 게시물만 확인
const API = 'https://static.apis.sbs.co.kr';
const WD = ['일','월','화','수','목','금','토'];

/* ---------- 날짜 도우미 (한국시간) ---------- */
const kstFmt = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul'});
const ymdOf = d => kstFmt.format(d);
const today = () => ymdOf(new Date());
const addDays = (ymd,n) => { const d=new Date(ymd+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
const diffDays = (a,b) => Math.round((new Date(a+'T00:00:00Z')-new Date(b+'T00:00:00Z'))/864e5);
const pad = n => String(n).padStart(2,'0');
const wdOf = ymd => WD[new Date(ymd+'T00:00:00Z').getUTCDay()];

function findDates(text, refYmd){
  if(!text) return [];
  const out = new Set(), refY = +refYmd.slice(0,4);
  const push = (y,m,d) => {
    m=+m; d=+d; if(m<1||m>12||d<1||d>31) return;
    let yy = y ? +y : refY, s = `${yy}-${pad(m)}-${pad(d)}`;
    if(!y && diffDays(s, refYmd) < -60) s = `${yy+1}-${pad(m)}-${pad(d)}`;
    out.add(s);
  };
  const t = text.replace(/\s+/g,' ');
  let r;
  const full=/(20\d{2})\s*[.\/-]\s*(\d{1,2})\s*[.\/-]\s*(\d{1,2})/g; while((r=full.exec(t))) push(r[1],r[2],r[3]);
  const kor=/(\d{1,2})\s*월\s*(\d{1,2})\s*일/g; while((r=kor.exec(t))) push(0,r[1],r[2]);
  const t2 = t.replace(full,' ');
  const sl=/(?<![\d.\/:])(\d{1,2})\s*[\/.]\s*(\d{1,2})(?![\d:])/g; while((r=sl.exec(t2))) push(0,r[1],r[2]);
  return [...out].sort();
}
function startMin(broad){
  const m = /(오전|오후|저녁|밤|새벽)?\s*(\d{1,2})\s*(?::\s*(\d{2})|시\s*(?:(\d{1,2})\s*분)?)/.exec(broad||'');
  if(!m) return 9999;
  let h=+m[2], mi=+(m[3]||m[4]||0);
  if(/오후|저녁|밤/.test(m[1]||'') && h<12) h+=12;
  return h*60+mi;
}
const fmtTime = mi => mi>=9999 ? '' : `${pad(Math.floor(mi/60))}:${pad(mi%60)}`;

/* ---------- 저장 (이 기기 전용) ---------- */
const store = {
  get(k,def){ try{ return JSON.parse(localStorage.getItem(k)) ?? def; }catch(e){ return def; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let ocrCache = store.get('ocrCache', {});     // 사진id → 읽은 글자
let overrides = store.get('overrides', {});   // 게시물id → {date} | {hide:true}

/* ---------- 상태 ---------- */
let progs = [], selDay = today(), entries = [], unknown = [], ocrQueue = [], ocrBusy = false, worker = null;
const $ = id => document.getElementById(id);
const setStatus = s => $('status').textContent = s;

async function getJSON(url){ const r = await fetch(url,{cache:'no-cache'}); if(!r.ok) throw new Error(r.status); return r.json(); }

async function loadAll(){
  setStatus('불러오는 중…');
  entries=[]; unknown=[]; ocrQueue=[];
  progs = await Promise.all(PROGRAMS.map(async p => {
    const o = {...p, start:9999, posts:[], err:'', latest:''};
    try{
      const m = await getJSON(`${API}/program-api/1.0/menu/${p.slug}`);
      o.vodid = m.program.vodid; o.broad = m.program.broaddate; o.start = startMin(o.broad);
      if(!p.igOnly){
        const ig = await getJSON(`${API}/gorealra-api/instagram/${o.vodid}.json`);
        o.posts = ig.data || [];
        if(o.posts[0]) o.latest = ymdOf(new Date(o.posts[0].timestamp.replace('+0000','Z')));
      }
    }catch(e){ o.err = '불러오기 실패'; }
    return o;
  }));
  progs.sort((a,b)=>a.start-b.start);
  const t = today();
  for(const p of progs) for(const post of p.posts) classify(p, post, t);
  render();
  setStatus(ocrQueue.length ? `사진 속 날짜 읽는 중… (0/${ocrQueue.length})` : `업데이트 ${new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}`);
  runOcr();
}

function slidesOf(post){
  if(post.children && post.children.data){
    const imgs = post.children.data.filter(c=>c.media_type==='IMAGE').map(c=>({id:c.id,url:c.media_url}));
    if(imgs.length) return imgs;
  }
  const url = post.media_type==='VIDEO' ? (post.thumbnail_url||post.media_url) : post.media_url;
  return [{id:post.id,url}];
}

function classify(p, post, t){
  const posted = ymdOf(new Date(post.timestamp.replace('+0000','Z')));
  if(diffDays(t, posted) > LOOKBACK_DAYS) return;
  const ov = overrides[post.id];
  if(ov && ov.hide) return;
  const slides = slidesOf(post);
  const inWin = d => { const x=diffDays(d,t); return x>=0 && x<=DAYS_AHEAD; };
  const base = {prog:p, post, posted};
  if(ov && ov.date){ if(inWin(ov.date)) entries.push({...base, date:ov.date, slides, manual:true}); return; }

  const cap = post.caption || '';
  const capDates = findDates(cap, posted);
  const fut = capDates.filter(inWin);
  const ocrable = slides.filter(s=>s.url && !/\.(heic|mp4)(\?|$)/i.test(s.url));
  const needOcr = capDates.length!==1 && ocrable.length>0 && diffDays(t,posted) <= 14;

  if(needOcr && ocrable.some(s=>!(s.id in ocrCache))){
    ocrQueue.push(...ocrable.filter(s=>!(s.id in ocrCache)));
    post._pending = true;
  }
  // 사진 글자로 장별 날짜 배정 (주간 편성표)
  if(capDates.length!==1){
    const byDate = {};
    for(const s of slides){
      const ds = findDates(ocrCache[s.id]||'', posted).filter(inWin);
      if(ds.length===1) (byDate[ds[0]] ||= []).push(s);
      else if(ds.length>1) ds.forEach(d=>(byDate[d] ||= []).push(s));
    }
    const keys = Object.keys(byDate);
    if(keys.length){ keys.forEach(d=>entries.push({...base, date:d, slides:byDate[d]})); return; }
  }
  if(fut.length){ fut.forEach(d=>entries.push({...base, date:d, slides})); return; }
  if(capDates.length) return; // 지난 날짜만 있음 → 제외
  // 날짜를 못 찾은 최근 사진 게시물 → 확인 필요
  if(post.media_type!=='VIDEO' && !/\/reel\//.test(post.permalink) && diffDays(t,posted)<=4)
    unknown.push({...base, slides});
}

async function runOcr(){
  if(ocrBusy || !ocrQueue.length) return;
  ocrBusy = true;
  const total = ocrQueue.length; let done = 0;
  try{
    if(!worker) worker = await Tesseract.createWorker('kor+eng');
    while(ocrQueue.length){
      const s = ocrQueue.shift();
      if(s.id in ocrCache){ done++; continue; }
      try{ const {data} = await worker.recognize(s.url); ocrCache[s.id] = data.text || ''; }
      catch(e){ ocrCache[s.id] = ''; }
      done++; store.set('ocrCache', pruneCache(ocrCache));
      setStatus(`사진 속 날짜 읽는 중… (${done}/${total})`);
      if(done%3===0 || !ocrQueue.length) reclassify();
    }
  }catch(e){ setStatus('사진 글자 읽기를 시작하지 못했어요 — 본문 날짜만 사용 중'); }
  ocrBusy = false;
  reclassify();
  setStatus(`업데이트 ${new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}`);
}
function pruneCache(c){ const k=Object.keys(c); if(k.length>600) k.slice(0,k.length-600).forEach(x=>delete c[x]); return c; }
function reclassify(){ entries=[]; unknown=[]; const t=today(); const q=ocrQueue; ocrQueue=[]; for(const p of progs) for(const post of p.posts) classify(p,post,t); ocrQueue=q; render(); }

/* ---------- 화면 ---------- */
const banchung = e => /방청/.test((e.post.caption||'') + e.slides.map(s=>ocrCache[s.id]||'').join(' '));

function render(){
  const t = today();
  const days = [...Array(DAYS_AHEAD+1)].map((_,i)=>addDays(t,i));
  const cnt = d => new Set(entries.filter(e=>e.date===d).map(e=>e.prog.slug)).size;
  $('days').innerHTML = days.map(d=>{
    const n=cnt(d), md=`${+d.slice(5,7)}/${+d.slice(8)}`;
    return `<div class="day ${d===selDay?'on':''} ${n?'':'empty'}" data-d="${d}"><b>${md}</b><small>${d===t?'오늘':wdOf(d)} · ${n}</small></div>`;
  }).join('') + `<div class="day ${selDay==='unknown'?'on':''} ${unknown.length?'warn':'empty'}" data-d="unknown"><b>확인</b><small>필요 ${unknown.length}</small></div>`;
  $('days').querySelectorAll('.day').forEach(el=>el.onclick=()=>{selDay=el.dataset.d; render(); scrollTo(0,0);});
  const m = $('main');
  if(selDay==='unknown'){
    m.innerHTML = unknown.length
      ? `<p class="status">날짜를 읽지 못한 최근 게시물이에요. 출연 예고면 날짜를 지정해 주세요.</p>` + unknown.map(e=>cardHTML(e,true)).join('')
      : `<div class="none">확인할 게시물이 없어요</div>`;
    bind(); return;
  }
  const list = entries.filter(e=>e.date===selDay);
  const html = progs.map(p=>{
    const es = list.filter(e=>e.prog===p).sort((a,b)=>a.post.timestamp<b.post.timestamp?1:-1);
    if(!es.length) return '';
    const bc = es.some(banchung);
    return `<section class="prog"><div class="ph"><h2>${p.name}</h2><span class="t">${fmtTime(p.start)}</span>${bc?'<span class="tag">방청</span>':''}</div>${es.map(e=>cardHTML(e)).join('')}</section>`;
  }).join('');
  const ten = progs.find(p=>p.youtube);
  m.innerHTML = (html || `<div class="none">${selDay===t?'오늘':'이 날'} 올라온 출연 정보가 없어요</div>`) +
    (ten ? `<div class="side"><h3>배성재의 텐 — 유튜브 게시판 <span class="tag yt">생.녹</span></h3>유튜브 생방송·생.녹 공지는 <a href="${ten.youtube}" target="_blank" rel="noopener">유튜브 게시판</a>에서 확인하세요.</div>` : '');
  bind();
}

function cardHTML(e, isUnknown){
  const s = e.slides, cap = (e.post.caption||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
  return `<div class="card" data-id="${e.post.id}">
    <div class="slides" data-link="${e.post.permalink}">${s.map(x=>`<img loading="lazy" src="${x.url}" alt="">`).join('')}</div>
    ${s.length>1?`<div class="cnt">← 옆으로 넘기기 · ${s.length}장</div>`:''}
    <div class="cap">${isUnknown?`[${e.prog.name}] `:''}${cap}</div>
    <div class="act">
      <a class="btn" href="${e.post.permalink}" target="_blank" rel="noopener">인스타에서 보기</a>
      <button class="btn" data-a="date">${isUnknown?'날짜 지정':'날짜 수정'}</button>
      <button class="btn" data-a="hide">숨기기</button>
      ${e.manual?'<button class="btn" data-a="reset">자동으로 되돌리기</button>':''}
    </div></div>`;
}

function bind(){
  document.querySelectorAll('.cap').forEach(c=>c.onclick=()=>c.classList.toggle('open'));
  document.querySelectorAll('.slides img').forEach(img=>img.onerror=()=>{
    const box = img.parentElement; if(box.dataset.embed) return; box.dataset.embed='1';
    const link = box.dataset.link.replace(/\/?$/,'/') + 'embed/';
    box.innerHTML = `<iframe src="${link}" loading="lazy" allowtransparency="true"></iframe>`;
  });
  document.querySelectorAll('.act button').forEach(b=>b.onclick=()=>{
    const id = b.closest('.card').dataset.id, a = b.dataset.a;
    if(a==='hide'){ overrides[id]={hide:true}; }
    if(a==='reset'){ delete overrides[id]; }
    if(a==='date'){
      const v = prompt('방송 날짜를 입력하세요 (예: 10/14)', '');
      if(!v) return;
      const d = findDates(v, today())[0];
      if(!d){ alert('날짜 형식을 확인해 주세요 (예: 10/14)'); return; }
      overrides[id] = {date:d};
    }
    store.set('overrides', overrides); reclassify();
  });
}

$('reload').onclick = loadAll;
$('info').onclick = () => {
  const rows = progs.map(p=>{
    const st = p.err ? `<span class="bad">${p.err}</span>`
      : p.igOnly ? `인스타 직접 수집 필요 (@${p.igOnly})`
      : p.latest && diffDays(today(),p.latest)>30 ? `<span class="bad">SBS 연동 멈춤 (마지막 ${p.latest})</span>`
      : `정상 · 최근 게시물 ${p.latest||'-'}`;
    return `<tr><td>${fmtTime(p.start)}</td><td>${p.name}</td><td>${st}</td></tr>`;
  }).join('');
  $('main').innerHTML = `<div class="side"><h3>프로그램 상태</h3><table>${rows}</table>
    <p>숨기기·날짜 수정은 이 기기에만 저장돼요.</p>
    <button class="btn" id="clr">숨기기·날짜 수정 초기화</button> <button class="btn" id="back">돌아가기</button></div>`;
  $('clr').onclick=()=>{ overrides={}; store.set('overrides',overrides); reclassify(); };
  $('back').onclick=render;
};
loadAll();
</script>
</body>
</html>

<style>
:root{
  --bg:#0b0c10; --panel:#15171d; --panel2:#1c1f27; --ink:#f3f4f8; --sub:#a3a9b6; --faint:#6b7180; --line:#262a34;
  --acc:#7b8cff; --acc-ink:#fff; --warn:#f5b13d; --hot:#ff5a73; --chip:#232733; --shadow:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;overflow-x:clip;overscroll-behavior-x:none}
header{overflow-x:clip}
body{background:radial-gradient(1200px 600px at 10% -10%,rgba(123,140,255,.10),transparent 60%),radial-gradient(900px 500px at 100% 0%,rgba(221,42,123,.08),transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:"Pretendard","Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.32;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22460%22%20height%3D%22460%22%20viewBox%3D%220%200%20460%20460%22%20fill%3D%22none%22%20stroke-width%3D%222.2%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%20%3Cdefs%3E%3Cfilter%20id%3D%22n%22%20x%3D%22-50%25%22%20y%3D%22-50%25%22%20width%3D%22200%25%22%20height%3D%22200%25%22%3E%3CfeGaussianBlur%20stdDeviation%3D%223.2%22%20result%3D%22b%22/%3E%3CfeMerge%3E%3CfeMergeNode%20in%3D%22b%22/%3E%3CfeMergeNode%20in%3D%22b%22/%3E%3CfeMergeNode%20in%3D%22SourceGraphic%22/%3E%3C/feMerge%3E%3C/filter%3E%3C/defs%3E%20%3Cg%20filter%3D%22url%28%23n%29%22%3E%20%3Cg%20stroke%3D%22%233de0ff%22%20transform%3D%22translate%2870%2080%29%22%3E%3Crect%20x%3D%22-12%22%20y%3D%22-28%22%20width%3D%2224%22%20height%3D%2240%22%20rx%3D%2212%22/%3E%3Cpath%20d%3D%22M-20%200a20%2020%200%200%200%2040%200M0%2020v14M-11%2034h22%22/%3E%3C/g%3E%20%3Cg%20stroke%3D%22%23ff4fd8%22%20transform%3D%22translate%28330%2090%29%22%3E%3Cpath%20d%3D%22M-32%200a32%2032%200%200%201%2064%200%22/%3E%3Cpath%20d%3D%22M-19%200a19%2019%200%200%201%2038%200%22/%3E%3Ccircle%20cx%3D%220%22%20cy%3D%220%22%20r%3D%223%22/%3E%3C/g%3E%20%3Cg%20stroke%3D%22%23a78bff%22%20transform%3D%22translate%28220%20230%29%22%3E%3Crect%20x%3D%22-38%22%20y%3D%22-18%22%20width%3D%2276%22%20height%3D%2236%22%20rx%3D%2210%22/%3E%3Ccircle%20cx%3D%22-16%22%20cy%3D%220%22%20r%3D%227%22/%3E%3Cpath%20d%3D%22M5%20-6h20M5%206h13%22/%3E%3Cpath%20d%3D%22M-24%20-18l20%20-20%22/%3E%3C/g%3E%20%3Cg%20stroke%3D%22%23ffd36b%22%20transform%3D%22translate%28100%20330%29%22%3E%3Cpath%20d%3D%22M0%20-16v22%22/%3E%3Ccircle%20cx%3D%22-6%22%20cy%3D%228%22%20r%3D%226%22/%3E%3Cpath%20d%3D%22M0%20-16l13%205%22/%3E%3C/g%3E%20%3Cg%20stroke%3D%22%233de0ff%22%20transform%3D%22translate%28370%20350%29%22%3E%3Cpath%20d%3D%22M-15%20-13v22M11%20-17v22M-15%20-13l26%20-4%22/%3E%3Ccircle%20cx%3D%22-20%22%20cy%3D%2210%22%20r%3D%225%22/%3E%3Ccircle%20cx%3D%226%22%20cy%3D%226%22%20r%3D%225%22/%3E%3C/g%3E%20%3Cg%20stroke%3D%22%23ff4fd8%22%20transform%3D%22translate%28260%20410%29%22%3E%3Cpath%20d%3D%22M-44%200h9l5%20-11l7%2022l7%20-28l7%2032l6%20-20l5%209h9%22/%3E%3C/g%3E%20%3Cg%20stroke%3D%22%23a78bff%22%20transform%3D%22translate%28410%20220%29%22%3E%3Cpath%20d%3D%22M-10%20-10h20v14h-20z%22/%3E%3Cpath%20d%3D%22M-6%20-16h12%22/%3E%3C/g%3E%20%3C/g%3E%3C/svg%3E");background-size:460px 460px;-webkit-mask-image:radial-gradient(ellipse at 50% 45%,#000 35%,rgba(0,0,0,.35) 90%);mask-image:radial-gradient(ellipse at 50% 45%,#000 35%,rgba(0,0,0,.35) 90%);animation:neonflick 2s ease-in-out infinite}
@keyframes neonflick{0%,100%{opacity:.18}50%{opacity:.4}}
#bgs{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#bgs img{position:absolute;width:auto;opacity:.4;animation:glow 1.8s ease-in-out infinite}
#bgs .g2{animation-delay:-.6s;animation-duration:2.2s} #bgs .g3{animation-delay:-1.2s;animation-duration:1.6s}
@keyframes glow{0%,100%{opacity:.25}50%{opacity:.6}}
#bgs .sp{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 6px 2px rgba(255,255,255,.8),0 0 14px 4px var(--c);opacity:0;animation:twinkle 1.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:.9;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#bgs img,#bgs .sp,body::before{animation:none!important}}
#bgs .g1{height:min(52vh,520px);right:2vw;bottom:-6vh;transform:rotate(-12deg)}
#bgs .g2{height:min(30vh,300px);left:-3vw;bottom:8vh;transform:rotate(18deg) scaleX(-1)}
#bgs .g3{height:min(22vh,220px);right:30vw;top:42vh;transform:rotate(-28deg)}
@media (max-width:820px){#bgs .g1{height:30vh;right:-8vw}#bgs .g2{height:18vh}#bgs .g3{display:none}}
body::after{content:"";position:fixed;right:-120px;bottom:-140px;width:520px;height:520px;z-index:-1;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(123,140,255,.10),transparent 65%)}


/* ---------- 상단 ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(11,12,16,.72);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid rgba(255,255,255,.06)}
.bar{max-width:1600px;margin:0 auto;padding:12px 16px 0;display:flex;align-items:center;gap:8px}
.bar h1{margin:0;font-size:20px;font-weight:900;letter-spacing:-.6px;flex:1;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bar h1 .when{font-size:14px;font-weight:700;color:var(--acc)}
.iconbtn{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:999px;height:34px;padding:0 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink)}
.iconbtn:hover{border-color:var(--acc);background:rgba(123,140,255,.10)}
.igbtn{background:linear-gradient(135deg,#f58529,#dd2a7b 55%,#8134af);color:#fff;border:0;font-weight:700}
.igbtn:hover{background:linear-gradient(135deg,#f58529,#dd2a7b 55%,#8134af);filter:brightness(1.1)}
.igbtn[disabled]{opacity:.75;cursor:wait}
.status{max-width:1600px;margin:0 auto;padding:3px 16px 0;font-size:12px;color:var(--faint);min-height:17px;display:flex;align-items:center;gap:8px}
.status .prog-bar{flex:0 0 120px;height:4px;border-radius:2px;background:var(--chip);overflow:hidden;display:none}
.status .prog-bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}

.days{max-width:1600px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:9px 16px 10px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;width:54px;border:1px solid transparent;background:rgba(255,255,255,.035);border-radius:14px;padding:6px 2px 6px;text-align:center;cursor:pointer;transition:transform .12s,background .12s}
.day:hover{transform:translateY(-1px);background:rgba(255,255,255,.07)}
.day .wd{font-size:11px;color:var(--sub);font-weight:600}
.day .dn{font-size:19px;font-weight:900;line-height:1.15;letter-spacing:-.5px}
.day .dots{display:flex;justify-content:center;gap:2px;height:6px;margin-top:3px}
.day .dots i{width:5px;height:5px;border-radius:50%}
.day.sun .wd,.day.sun .dn{color:var(--hot)} .day.sat .wd{color:var(--acc)}
.day.empty{opacity:.35}
.day.past{opacity:.55}
.day.past.empty{opacity:.22}
.day.today{border-color:rgba(123,140,255,.6)}
.day.on{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 6px 18px rgba(123,140,255,.35)}
.day.on .wd,.day.on .dn{color:#fff}
.day.chk{width:66px;border-color:rgba(245,177,61,.45)}
.day.chk .dn{font-size:17px;color:var(--warn)} .day.chk.on{background:var(--warn);border-color:var(--warn);box-shadow:0 6px 18px rgba(245,177,61,.3)} .day.chk.on .dn{color:#1a1200}

.jump{max-width:1600px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump:empty{display:none}
.jump button{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:999px;padding:2px 11px 2px 2px;cursor:pointer;font-size:12.5px;font-weight:700;transition:all .15s}
.jump button img{width:24px;height:24px;border-radius:50%;object-fit:cover;background:#fff}
.jump button:hover{border-color:var(--pc)}
.jump button.on{background:var(--pc);border-color:var(--pc);color:#fff}

/* ---------- 본문: 포스터 월 ---------- */
main{max-width:1600px;margin:0 auto;padding:18px 16px 90px}
.sec{font-size:16px;font-weight:900;margin:4px 0 14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.sec small{font-size:12.5px;font-weight:500;color:var(--sub)}
.wall+.sec{margin-top:34px}
.empty-msg{text-align:center;color:var(--sub);padding:80px 0 40px;font-size:15px}
.board{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:18px;align-items:stretch}
@media (max-width:1100px){.board{grid-template-columns:repeat(3,minmax(0,1fr))}}
.board+.sec{margin-top:34px}
.pc{scroll-margin-top:var(--hh,200px);background:var(--panel);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;border:1px solid rgba(255,255,255,.05);box-shadow:0 8px 24px rgba(0,0,0,.35);transition:border-color .2s}
.pc:hover{border-color:color-mix(in srgb,var(--pc) 55%,transparent)}
.pch{display:flex;align-items:center;gap:9px;padding:10px 10px 10px 11px;background:linear-gradient(135deg,color-mix(in srgb,var(--pc) 70%,#000),color-mix(in srgb,var(--pc) 28%,#0d0f14));min-height:58px}
.pch .lg{width:36px;height:36px;flex:0 0 36px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid rgba(255,255,255,.9)}
.pch .t{flex:1;min-width:0}
.pch .nm{font-size:14.5px;font-weight:900;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.pch .l1{display:flex;align-items:center;gap:4px;margin-top:3px;overflow:hidden}
.pch .tm{font-size:12px;font-weight:900;background:#fff;color:#111;border-radius:999px;padding:1px 7px}
.pch .ch{white-space:nowrap;font-size:10.5px;font-weight:700;color:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:0 6px}
.tabs{display:flex;gap:4px;padding:6px 8px;background:color-mix(in srgb,var(--pc) 14%,#0f1116);border-bottom:1px solid rgba(255,255,255,.06);align-items:center;min-height:42px}
.pcb{position:relative;container-type:inline-size}
/* ★ 메인 게스트 탭: 광택 + 심장박동 */
.tabs.multi .pt.hot{position:relative;overflow:visible;color:#fff;border-color:transparent;background:linear-gradient(135deg,#ff2d7a,#ff6a3d 55%,#ffb13d);box-shadow:0 0 12px rgba(255,60,120,.45);z-index:1;animation:beat 1.3s ease-in-out infinite}
.tabs .tabhint{position:absolute;right:8px;width:calc(50% - 30px);text-align:center;bottom:calc(100% - 4px);white-space:nowrap;font-size:10.5px;font-weight:800;letter-spacing:-.2px;pointer-events:none;
  color:#ffd978;text-shadow:0 1px 3px rgba(0,0,0,.6);animation:hintb 1.6s ease-in-out infinite}
@keyframes hintgloss{0%{background-position:120% 0}100%{background-position:-120% 0}}
.tabs{overflow:visible;position:relative}
@media (max-width:820px){ .tabs .tabhint{display:none} }
.tabs.multi .pt.hot .hs{font-style:normal;font-size:12px;margin-right:2px;display:inline-block}
.tabs.multi .pt.hot .gl{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:inherit}
.tabs.multi .pt.hot .gl::after{content:"";position:absolute;top:-30%;bottom:-30%;width:45%;left:0;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7) 50%,transparent);transform:translateX(-160%) skewX(-18deg);animation:gloss 2s ease-in-out infinite}
.tabs.multi .pt .gl{display:none}.tabs.multi .pt.hot .gl{display:block}
@keyframes beat{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,60,120,.6)}14%{transform:scale(1.09)}28%{transform:scale(1)}42%{transform:scale(1.07);box-shadow:0 0 0 7px rgba(255,60,120,0)}70%{transform:scale(1)}}
@keyframes spin3{to{transform:rotate(360deg)}}
/* 인스타 스토리처럼: 사진 왼쪽 아래 동그라미 */
.story{position:absolute;left:10px;top:calc(100cqw - 92px);display:flex;gap:8px;z-index:4;pointer-events:none}
.sty{outline:none;pointer-events:auto;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;animation:beat 1.3s ease-in-out infinite}
.sty .ring{width:58px;height:58px;border-radius:50%;padding:3px;background:conic-gradient(from var(--ra,0deg),#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75);animation:ringspin 2.4s linear infinite;box-shadow:0 4px 16px rgba(214,41,118,.55)}
.sty .ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:top;border:3px solid #111;display:block}
.sty b{font-size:11px;font-weight:900;color:#fff;background:linear-gradient(135deg,#ff2d7a,#ff6a3d);border-radius:999px;padding:2px 8px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.sty.seen{animation:none}.sty.seen .ring{animation:none;background:#555}
@property --ra{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes ringspin{to{--ra:360deg}}
@media (prefers-reduced-motion:reduce){.tabs.multi .pt.hot,.sty,.sty .ring,.tabs.multi .pt.hot .gl::after{animation:none!important}}
.tabs .tn{font-size:10.5px;font-weight:900;color:#fff;background:var(--hot);border-radius:999px;padding:2px 7px;flex:0 0 auto;margin-right:2px;animation:tnp 2.4s ease-in-out 3}
@keyframes tnp{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.tabs .pt{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:5px;height:30px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--faint);font-size:12px;font-weight:800;padding:0 6px;cursor:default;letter-spacing:-.3px}
.tabs .pt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs .pt img{width:20px;height:24px;border-radius:4px;object-fit:cover;object-position:top;flex:0 0 20px}
.tabs:not(.multi) .pt{justify-content:flex-start;color:color-mix(in srgb,var(--pc) 40%,#fff);padding-left:4px}
.tabs:not(.multi) .pt::before{content:"📌";font-size:11px}
.tabs.multi .pt{cursor:pointer;background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.10);color:var(--sub)}
.tabs.multi .pt:hover{border-color:color-mix(in srgb,var(--pc) 70%,#fff);color:var(--ink)}
.tabs.multi .pt.on{background:color-mix(in srgb,var(--pc) 75%,#000);border-color:color-mix(in srgb,var(--pc) 60%,#fff);color:#fff;box-shadow:0 2px 10px color-mix(in srgb,var(--pc) 40%,transparent)}
.pcb{display:flex;flex-direction:column;flex:1}

.pill{font-size:10.5px;font-weight:800;border-radius:999px;padding:2px 7px;background:var(--chip);color:var(--sub);white-space:nowrap;letter-spacing:-.2px}
.pill.hot{background:var(--hot);color:#fff}
.pill.week{background:#7c3aed;color:#fff}
.pill.yt{background:#e62117;color:#fff}
.pill.kp{background:#b45309;color:#fff}
.pill.ch{background:transparent;border:1px solid var(--line);color:var(--faint);padding:1px 6px}

.tile{position:relative;cursor:zoom-in;outline:none}
.tile .pic{position:relative;aspect-ratio:1/1;background:#000;overflow:hidden;touch-action:pan-y}
.pc .pcb{touch-action:pan-y}
.pc .tabs{position:relative}
.pc .tabs .rw{display:none}
.pc .tabs .rw i{font-style:normal}
.pc.rwt.away .tabs:not(.multi) .rw::after{content:"";position:absolute;left:9px;right:9px;bottom:2px;height:2px;border-radius:2px;background:rgba(255,255,255,.85);transform-origin:left center;animation:rwbar 5s linear forwards}
@keyframes rwbar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.pc.away .tabs:not(.multi){cursor:pointer}
.pc.away .tabs:not(.multi) .rw{display:inline-flex;align-items:center;gap:4px;position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:900;color:#fff;background:linear-gradient(90deg,#6d5cff,#b04dff);padding:3px 10px;border-radius:999px;box-shadow:0 2px 10px rgba(120,90,255,.5);animation:rwp 1.6s ease-in-out infinite;pointer-events:none}
@media (max-width:600px){.pc .tabs .rw i{display:none}.pc.away .tabs:not(.multi) .rw{font-size:11px;padding:2px 8px;right:6px}}
.ft{container-type:inline-size}
.ft .up{font-size:clamp(9px,3.9cqw,12px);max-width:100%}
@keyframes rwp{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
.tile .pic.car{touch-action:auto}
.tile .pic.car .trk{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
.tile .pic.car .trk::-webkit-scrollbar{display:none}
.tile .pic.car .sl{position:relative;flex:0 0 100%;width:100%;height:100%;overflow:hidden;scroll-snap-align:center;scroll-snap-stop:always;contain:paint}
.tile .pic.car .sl .noimg{position:absolute;inset:0}
.vw .stage .imgwrap{position:relative;align-self:stretch}
.vtrk{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior:contain;scrollbar-width:none;touch-action:pan-x}
.vtrk::-webkit-scrollbar{display:none}
.vsl{flex:0 0 100%;width:100%;height:100%;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;scroll-snap-stop:always}
/* 메모 띠 */
.memo{position:relative;overflow:hidden;display:flex;align-items:center;gap:8px;padding:9px 12px 9px 16px;font-size:14px;font-weight:900;line-height:1.3;letter-spacing:-.2px;color:#fff;background:linear-gradient(90deg,var(--m1),var(--m2));border-bottom:1px solid rgba(0,0,0,.35);text-shadow:0 1px 2px rgba(0,0,0,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
.memo::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:repeating-linear-gradient(-45deg,#15161c 0 5px,var(--m3) 5px 10px)}
.memo .mi{font-size:16px;flex:none;animation:mwig 3.2s ease-in-out infinite;transform-origin:50% 90%}
.memo span{flex:1;min-width:0;word-break:keep-all}

.vw.on{display:flex;opacity:1}

.vw .stage .imgwrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.vw .stage img.big{cursor:zoom-out;max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.6);user-select:none;-webkit-user-drag:none}

.vw .vf{border-top:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:8px}

.vw .vf .pn button{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:12.5px;font-weight:700}

const DATE_RE = /(20\d{2})\s*[.\/-]\s*(\d{1,2})\s*[.\/-]\s*(\d{1,2})|(?<!\d)(2\d)(0[1-9]|1[0-2])([0-2]\d|3[01])(?!\d)|(\d{1,2})\s*월\s*(\d{1,2})\s*일|(?<![\d.\/:])(\d{1,2})\s*[\/.]\s*(\d{1,2})(?![\d:])/g;
const RANGE_SEP = /^\s*(?:\([^)]*\)|\[[^\]]*\]|[월화수목금토일]요?일?|\s)*\s*[~∼〜\-–]\s*$/;

function findDates(text, refYmd){
  if(!text) return [];
  const t = text.replace(/\s+/g,' '), refY = +refYmd.slice(0,4);
  const hits = []; let r;
  DATE_RE.lastIndex = 0;
  while((r = DATE_RE.exec(t))){
    let y=0,m,d;
    if(r[1]){ y=+r[1]; m=+r[2]; d=+r[3]; }
    else if(r[4]){ y=2000+(+r[4]); m=+r[5]; d=+r[6]; }
    else if(r[7]){ m=+r[7]; d=+r[8]; }
    else { m=+r[9]; d=+r[10]; }
    if(m<1||m>12||d<1||d>31) continue;
    let yy = y || refY, s = `${yy}-${pad(m)}-${pad(d)}`;
    if(!y && diffDays(s, refYmd) < -60) s = `${yy+1}-${pad(m)}-${pad(d)}`;
    const after = t.slice(r.index + r[0].length, r.index + r[0].length + 14);
    const before = t.slice(Math.max(0, r.index - 8), r.index);
    hits.push({s, start:r.index, end:r.index + r[0].length, event: EVENT_RE.test(after.replace(/^[\s)\]]*\(?[월화수목금토일]?\)?/, '').slice(0,8)) || /개봉|공연|발매|생일/.test(before)});
  }
  const out = new Set(), used = new Set();
  for(let i=0;i<hits.length;i++){
    const a = hits[i], b = hits[i+1];
    if(b && RANGE_SEP.test(t.slice(a.end, b.start))){
      const span = diffDays(b.s, a.s);
      if(span>=0 && span<=14 && !b.event){ for(let k=0;k<=span;k++) out.add(addDays(a.s,k)); }
      used.add(i); used.add(i+1); i++; continue;
    }
    if(!used.has(i) && !a.event) out.add(a.s);
  }
  return [...out].sort();
}
function startMin(broad){
  const m = /(오전|오후|저녁|밤|새벽)?\s*(\d{1,2})\s*(?::\s*(\d{2})|시\s*(?:(\d{1,2})\s*분)?)/.exec(broad||'');
  if(!m) return 9999;
  let h=+m[2], mi=+(m[3]||m[4]||0);
  if(/오후|저녁|밤/.test(m[1]||'') && h<12) h+=12;
  return h*60+mi;
}
const fmtTime = mi => mi>=9999 ? '' : `${pad(Math.floor(mi/60))}:${pad(mi%60)}`;
const esc = s => String(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

};

const SYNC_URL = 'https://script.google.com/macros/s/AKfycbyWFC0vzaAbKPoDMc2rrF4ucckHh9VTRrSPLAi_6MPQN_XAE1Ahak-Ufmd2hFuGf8ki/exec';   // ← 배포한 웹 앱 주소(…/exec)를 여기에 넣으면 모든 기기가 자동 연동

async function pullSync(){
  if(!syncUrl) return false;
  try{
    const r = await fetch(syncUrl + (syncUrl.includes('?')?'&':'?') + 'v=2&t=' + Date.now());
    const j = await r.json();
    if(j && typeof j==='object'){
      if(j.overrides){ overrides = j.overrides; igData = j.ig || {}; ytData = j.yt || null; keepData = j.keep || {};
        if(j.ocr){ for(const k in j.ocr) if(!(k in ocrCache)) ocrCache[k] = j.ocr[k];
          // 이 기기가 예전에 읽어 둔 것 중 저장소에 없는 것도 올려 공유
          if(!ocrUploaded){ ocrUploaded = true; for(const k in ocrCache) if(!(k in j.ocr)) ocrNew[k] = ocrCache[k]; shareOcr(); } } }
      else overrides = j;   // 예전 저장소 코드
      store.set('overrides', overrides); syncOk = true; return true;
    }
  }catch(e){ syncOk = false; }
  return false;
}
function pushSync(body){
  if(!syncUrl) return;
  fetch(syncUrl, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)})
    .then(()=>{ syncOk = true; }).catch(()=>{ syncOk = false; setStatus('⚠ 연동 저장 실패 — 이 기기에만 저장됐어요'); });
}

/* ---------- 불러오기: 저장본 즉시 표시 → SBS·구글 동시에 새로 받기 ---------- */
let rawSbs = store.get('rawSbs', {});      // slug → {meta, posts, at}
let metaCache = store.get('metaCache', {}); // slug → 프로그램 정보 (시간·색·로고, 하루 보관)
let loading = false;

function programList(){
  const extra = Object.values(overrides).filter(v=>v && v.prog && !PROGRAMS.some(x=>x.slug===v.slug))
                     .map(v=>({slug:v.slug, name:v.name||v.slug, ig:v.ig||'', added:true}));
  return [...PROGRAMS, ...extra];
}
async function fetchMeta(p){
  const c = metaCache[p.slug];
  if(c && Date.now()-c.at < 864e5) return c;
  const m = (await getJSON(`${API}/program-api/1.0/menu/${p.slug}`)).program;
  const v = {vodid:m.vodid, broad:m.broaddate, title:m.title, color:m.color, section:m.section,
             logo: m.circleimg ? (m.circleimg.startsWith('//') ? 'https:'+m.circleimg : m.circleimg) : '', at:Date.now()};
  metaCache[p.slug] = v; return v;
}
async function fetchSbs(p){
  try{
    const meta = await fetchMeta(p);
    let posts = [];
    if(!p.igOnly) posts = (await getJSON(`${API}/gorealra-api/instagram/${meta.vodid}.json`)).data || [];
    rawSbs[p.slug] = {meta, posts, at:Date.now()};
  }catch(e){ if(rawSbs[p.slug]) rawSbs[p.slug].err = 'SBS 불러오기 실패'; else rawSbs[p.slug] = {err:'SBS 불러오기 실패', posts:[]}; }
}
function assemble(p){
  const r = rawSbs[p.slug] || {posts:[]}, m = r.meta || {};
  const o = {...p, start:9999, posts:[], err:r.err||'', latest:'', color:'#6b7280', logo:'', ch:''};
  if(m.vodid){
    o.vodid = m.vodid; o.broad = m.broad; o.start = startMin(m.broad);
    if(p.added && m.title) o.name = m.title;
    if(m.color) o.color = m.color;
    o.logo = m.logo || '';
    o.ch = m.section==='PF' ? '파워FM' : m.section==='LF' ? '러브FM' : '';
  }
  o.posts = (r.posts||[]).map(q=>({...q}));
  if(o.posts[0]) o.latest = tsYmd(o.posts[0].timestamp);
  // 인스타 직접 수집분을 합침 (같은 게시물은 SBS 쪽 사진을 우선 — SBS 사진은 만료되지 않음)
  const igd = p.ig && igData[p.ig];
  if(igd && igd.posts){
    o.igAt = igd.at;
    const have = new Set(o.posts.map(postKey));
    for(const q of igd.posts){ if(!have.has(postKey(q))){ o.posts.push({...q, _ig:true}); have.add(postKey(q)); } }
  }
  // 배성재의 텐 유튜브 게시판
  if(p.youtube && ytData && ytData.posts){
    o.ytAt = ytData.at; o.ytErr = ytData.err;
    for(const y of ytData.posts){
      const imgs = (y.imgs||[]).map((u,i)=>({id:'yt_'+y.id+'_'+i, media_type:'IMAGE', media_url:u}));
      o.posts.push({id:'yt_'+y.id, caption:y.text, timestamp:y.pub, _yt:true,
        media_type: imgs.length>1?'CAROUSEL_ALBUM':'IMAGE', media_url: imgs[0] ? imgs[0].media_url : null,
        permalink:'https://www.youtube.com/post/'+y.id, ...(imgs.length>1?{children:{data:imgs}}:{})});
    }
  }
  for(const q of o.posts){ const k = postKey(q); if(k !== String(q.id)) q._oid = String(q.id); q.id = k; }
  // 보관함: 인스타·홈페이지에서 지워졌어도 방송 주가 끝나기 전이면 다시 보여줌
  const have2 = new Set(o.posts.map(q=>q.id));
  for(const id in keepData){
    const k = keepData[id];
    if(k.slug !== p.slug || have2.has(id) || weekEnd(k.until) < today()) continue;
    o.posts.push({...k.post, id, _kept:true, _keepDates:k.dates||{}});
  }
  o.posts.sort((a,b)=>a.timestamp<b.timestamp?1:-1);
  if(o.posts[0]) o.latestAny = tsYmd(o.posts[0].timestamp);
  return o;
}
function buildAll(queue){
  progs = programList().map(assemble).sort((a,b)=>a.start-b.start);
  rebuild(queue, false);
}
function saveSnap(){
  store.set('rawSbs', rawSbs); store.set('metaCache', metaCache);
  store.set('syncSnap', {ig:igData, yt:ytData, keep:keepData});
}
async function loadAll(){
  if(loading) return; loading = true;
  // 1) 저장해 둔 지난 화면을 바로 표시
  if(!progs.length && Object.keys(rawSbs).length){
    const sn = store.get('syncSnap', null);
    if(sn){ igData = sn.ig||{}; ytData = sn.yt||null; keepData = sn.keep||{}; }
    buildAll(false);
    setStatus('최신 내용 불러오는 중…');
  } else setStatus('불러오는 중…');
  // 2) 구글 저장소와 SBS를 동시에
  const syncP = pullSync();
  await Promise.all(programList().map(fetchSbs));
  buildAll(false);                                  // SBS 최신분 먼저 반영
  setStatus('최신 내용 불러오는 중… (연동 자료)');
  await syncP;
  const more = programList().filter(p=>!rawSbs[p.slug]);   // 연동으로 새로 생긴 프로그램
  if(more.length) await Promise.all(more.map(fetchSbs));
  buildAll(true);
  saveSnap();
  loading = false;
  runOcr();
}

// 같은 인스타 게시물은 SBS·인스타 어느 쪽에서 와도 같은 이름(주소 끝부분)으로
function postKey(q){ const m = /instagram\.com\/(?:p|reel|tv)\/([^/?#]+)/.exec(q.permalink||''); return m ? m[1] : String(q.id); }

function slidesOf(post){
  if(post.children && post.children.data){
    const imgs = post.children.data.filter(c=>c.media_type==='IMAGE').map(c=>({id:c.id,url:c.media_url}));
    if(imgs.length) return imgs;
  }
  return [{id:post.id, url: post.media_type==='VIDEO' ? (post.thumbnail_url||post.media_url) : post.media_url}];
}

function classify(p, post, t, queue){
  const posted = tsYmd(post.timestamp);
  if(post._kept){
    const ov0 = overrides[post.id]; if(ov0 && ov0.hide) return;
    if(ov0 && ov0.unk){ const g = (ov0.unkD||[]).slice().sort(); unknown.push({prog:p, post, posted, slides:slidesOf(post), guess:g[0]||'', guessAll:g, sent:true}); return; }
    const sl = slidesOf(post), x = d => diffDays(d,t);
    for(const [d,st] of Object.entries(post._keepDates)){
      if(d>=weekStart(t) && x(d)<=DAYS_AHEAD) { const ks=Object.keys(post._keepDates).sort(); entries.push({prog:p, post, posted, slides:sl, date:d, start:st.s||0, weekly:!!st.w, manual:!!st.m, range: ks.length>1?[ks[0],ks[ks.length-1]]:null}); }
      else if(x(d)>DAYS_AHEAD && x(d)<=FAR_DAYS) unknown.push({prog:p, post, posted, slides:sl, guess:d, far:true, confirmed:!!st.m});
    }
    return;
  }
  if(diffDays(t, posted) > LOOKBACK_DAYS) return;
  const ov = overrides[post.id] || (post._oid && overrides[post._oid]);
  if(ov && ov.hide) return;
  const slides = slidesOf(post);
  const inWin = d => d >= weekStart(t) && diffDays(d,t) <= DAYS_AHEAD;   // 이번 주 월요일부터 2주 뒤까지
  const inFar = d => { const x=diffDays(d,t); return x>DAYS_AHEAD && x<=FAR_DAYS; };
  const base = {prog:p, post, posted, slides};
  // 직접 '확인 필요로 보내기' 한 게시물: 달력에서 빼고 확인 필요에만 (원래 날짜는 '찾은 날짜'로 남겨서 ✓ 맞음으로 되돌릴 수 있게)
  if(ov && ov.unk){ const g = (ov.unkD||[]).slice().sort(); unknown.push({...base, guess:g[0]||'', guessAll:g, sent:true}); return; }
  if(ov && bcDates(ov, post.id).length){
    for(const d of bcDates(ov, post.id)){
      if(inWin(d)) entries.push({...base, date:d, start:0, manual:true});
      else if(inFar(d)) unknown.push({...base, guess:d, far:true, confirmed:true});
    }
    return;
  }

  const cap = post.caption || '';
  const isVideo = post.media_type==='VIDEO' || /\/reel\//.test(post.permalink||'');
  if(isVideo) return;                                   // 영상 클립은 지난 방송분
  // 유튜브 게시판의 [안내] 일정 글은 앞으로의 생.녹 일정표
  const ytSched = post._yt && /안내|생녹|생방|일정|편성/.test(cap);
  const future = ytSched || FUTURE_RE.test(cap);
  if(RECAP_RE.test(cap) && !future) return;             // 방송 후기·기념사진
  const guestish = GUEST_RE.test(cap) || future;

  let capDates = findDates(cap, posted);
  // 유튜브 공지는 "오늘 밤", "내일" 처럼 쓰는 경우가 많음
  if(post._yt && !capDates.length){
    if(/모레/.test(cap)) capDates = [addDays(posted,2)];
    else if(/내일/.test(cap)) capDates = [addDays(posted,1)];
    else if(/오늘|tonight|잠시\s*후|곧/i.test(cap)) capDates = [posted];
  }
  const ocrable = slides.filter(s=>s.url && !/\.(heic|mp4)(\?|$)/i.test(s.url));
  const wantOcr = guestish && ocrable.length>0 && diffDays(t,posted) <= 10 && (capDates.length!==1 || slides.length>1);
  const pending = wantOcr && ocrable.some(s=>!(s.id in ocrCache));
  if(pending && queue) for(const s of ocrable) if(!(s.id in ocrCache) && !ocrQueue.some(q=>q.id===s.id)) ocrQueue.push({...s, ts:post.timestamp});

  const slideDates = slides.map(s=>findDates(ocrCache[s.id]||'', posted));
  const all = new Set(capDates); slideDates.forEach(ds=>ds.forEach(d=>all.add(d)));
  const fut = [...all].filter(inWin).sort();
  if(!fut.length){
    const far = [...all].filter(inFar).sort();
    if(far.length) unknown.push({...base, guess:far[0], guessAll:far, far:true});   // 2주 뒤~한 달 뒤 미리 잡힌 일정
    else if(!all.size && guestish && !pending && diffDays(t,posted)<=4) unknown.push(base);
    return;
  }
  // 앞으로 나온다는 말이 없으면 자동으로 올리지 않고 "확인 필요"로 (찾은 날짜를 같이 보여줌)
  const ocrText = slides.map(s=>ocrCache[s.id]||'').join(' ');
  const futureAll = future || FUTURE_RE.test(ocrText) || (slides.length>1 && all.size>=3);
  if(!futureAll){
    if(diffDays(t,posted)<=10) unknown.push({...base, guess:fut[0], guessAll:[...all].filter(d=>inWin(d)||inFar(d)).sort()});
    return;
  }
  const weekly = slides.length>1 && all.size>=3;
  for(const d of fut){
    let idx = slideDates.findIndex(ds=>ds.length===1 && ds[0]===d);
    if(idx<0) idx = slideDates.findIndex(ds=>ds.length>0 && ds.length<=2 && ds.includes(d));
    const sa = [...all].sort();
    entries.push({...base, date:d, start:Math.max(0,idx), weekly, range: sa.length>1 ? [sa[0], sa[sa.length-1]] : null});
  }
}

// 방송 날짜 (예전 방식으로 방문일만 넣어 둔 경우는 방송 날짜로 치지 않음)
function bcDates(ov, id){
  const ds = ovDates(ov);
  if(ov.visit && !ov.link && ds.length===1 && ds[0]===ov.visit.d && !ov.vdKeep){
    // 예전 버전이 방송 날짜를 방문일로 덮어쓴 경우 → 보관함에 남아 있는 원래 확정 날짜로 되살림
    const k = id && keepData[id];
    return k && k.dates ? Object.keys(k.dates).filter(d=>d!==ov.visit.d && k.dates[d].m).sort() : [];
  }
  return ds;
}
/* 🚪 실제 방문일(녹음 등): 방송 날짜 칸은 그대로 두고, 방문 날짜 칸에도 같은 게시물을 '방문'으로 추가 */
function addVisits(t){
  for(const k in overrides){
    const v = overrides[k]; if(!v || !v.visit || v.hide || v.unk) continue;
    const vd = v.visit.d, x = diffDays(vd, t);
    const mine = e => e.post && (e.post.id===k || e.post._oid===k);
    const all = [...entries.filter(mine), ...unknown.filter(mine)];
    const bc = [...new Set(all.map(e=>e.date||e.guess).filter(Boolean))].sort();
    let tpl = all[0];
    if(!tpl){   // 자동으로 날짜를 못 찾은 게시물도 방문일에는 나오게
      for(const p of progs){ const post = p.posts.find(q=>q.id===k || q._oid===k); if(post){ tpl = {prog:p, post, posted:tsYmd(post.timestamp), slides:slidesOf(post)}; break; } }
    }
    if(!tpl) continue;
    for(const e of all){ e.visit = v.visit; e.bc = bc; }
    if(vd < weekStart(t) || x > FAR_DAYS) continue;
    const ex = entries.find(e=>mine(e) && e.date===vd);
    if(ex){ ex.atV = true; continue; }
    const ve = {...tpl, date:vd, start:0, weekly:false, range:null, manual:true, visit:v.visit, bc, atV:true, vOnly:true};
    delete ve.guess; delete ve.far; delete ve.guessAll;
    if(x<=DAYS_AHEAD) entries.push(ve); else unknown.push({...ve, date:undefined, guess:vd, far:true, confirmed:true});
  }
}
let lastSig = '';
const pos = {};   // 카드별로 지금 보고 있는 사진 번호 (화면을 다시 그려도 유지)
const sigOf = () => selDay + '#' + (selDay==='unknown'
  ? unknown.map(e=>e.post.id).join(',')
  : entries.filter(e=>e.date===selDay).map(e=>e.post.id+':'+e.start+':'+e.slides.length).sort().join(','));
function rebuild(queue, force){
  entries=[]; unknown=[];
  const t = today();
  for(const p of progs) for(const post of p.posts) classify(p, post, t, queue);
  for(const k in overrides){
    const v = overrides[k];
    if(!v || !(v.link || v.guest)) continue;
    const p = progs.find(x=>x.slug===v.slug); if(!p) continue;
    for(const d of ovDates(v)){
      const x = diffDays(d, t); if(d < weekStart(t) || x>FAR_DAYS) continue;
      const e = {prog:p, post:{id:k, caption:v.note||(v.guest?'':'직접 추가한 게시물'), permalink:v.link||v.url||'', timestamp:new Date(v.t||Date.now()).toISOString()}, slides:v.img?[{id:'gimg_'+k, url:v.img}]:[], posted:t, date:d, start:0, link:true, guestName:v.guest||''};
      if(x<=DAYS_AHEAD) entries.push(e); else unknown.push({...e, guess:d, far:true, confirmed:true});
    }
  }
  // 고정 출연자: 정해진 요일마다 자동으로 카드가 생김 (안 옴·다른 날로 옮김·일기 기록 반영)
  for(const k in overrides){
    const v = overrides[k];
    if(!v || !v.reg || !v.name) continue;
    const p = progs.find(x=>x.slug===v.slug); if(!p) continue;
    const ex = v.ex || {}, ws = weekStart(t);
    const mk = (d, x, extra) => ({prog:p, post:{id:k+'@'+(extra&&extra.from||d), caption:v.note||'', permalink:'', timestamp:new Date(v.t||Date.now()).toISOString()}, slides:v.img?[{id:'rimg_'+k, url:v.img}]:[], posted:t, date:d, start:0, link:true, guestName:v.name, reg:k, regD:extra&&extra.from||d, regSt:extra?'in':(x?x.st:''), regX:x||null, ...(extra||{})});
    for(let i=0; i<=diffDays(addDays(t,DAYS_AHEAD), ws); i++){
      const d = addDays(ws, i);
      if(v.since && d < v.since) continue; if(v.until && d > v.until) continue;
      if((v.dow||[]).includes(wdIdx(d))) entries.push(mk(d, ex[d]));
    }
    for(const od in ex){ const x = ex[od];
      if(x && x.st==='moved' && x.to && x.to>=ws && diffDays(x.to,t)<=DAYS_AHEAD) entries.push(mk(x.to, x, {from:od}));
    }
  }
  addVisits(t);
  // 보관본(원본 삭제됨)은 같은 프로그램·같은 날짜에 새 게시물이 있으면 확인 필요로 옮김
  const fresh = new Set(entries.filter(e=>!e.post._kept).map(e=>e.prog.slug+'|'+e.date));
  entries = entries.filter(e=>{
    if(!e.post._kept || !fresh.has(e.prog.slug+'|'+e.date)) return true;
    if(!unknown.some(u=>u.post.id===e.post.id)) unknown.push({...e, guess:e.date, confirmed:true, replaced:true});
    return false;
  });
  // 보고 있는 날짜의 내용이 그대로면 위쪽 날짜 칸만 고치고 사진은 건드리지 않음
  if(force===false && sigOf()===lastSig) renderDays(); else render();
  if(!ocrBusy) setStatus(`업데이트 ${new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}`);
  if(!ocrBusy) saveKeep();
  if(!ocrBusy) saveHist();
}

/* 화면에 잡힌 일정을 저장소 보관함에 올림 (원본이 삭제돼도 날짜 지날 때까지 보이게) */

function histText(e){
  if(e.reg){ const x = e.regX || {}; return `${e.guestName} (고정 출연${e.regSt==='in'?` · 원래 ${fmd(e.from)} 대신`:''})${x.memo?' '+x.memo:''}${e.post.caption?' '+e.post.caption:''}`.slice(0,260); }
  if(e.guestName) return (e.guestName + ' ' + (e.post.caption||'')).trim().slice(0,260);
  const lines = (e.post.caption||'').split('\n');

  if(e.weekly && e.date){
    const w = WD[wdIdx(e.date)];
    const ln = lines.find(l=>new RegExp('^\\s*[\\[(【<]?\\s*'+w+'(?:요일)?\\s*[\\])】>]').test(l)) || lines.find(l=>findDates(l, e.date).includes(e.date));
    if(ln) txt = ln.trim();
  } else if(e.post._yt && e.date){

  const s = e.slides[e.start||0];
  const ocr = s ? (ocrCache[s.id]||'').replace(/\s+/g,' ').slice(0,240) : '';
  return (txt + (ocr ? ' ‖ ' + ocr : '')).slice(0,580);
}
function saveHist(){
  if(!syncUrl || !syncOk) return;
  const t = today(), add = {};

  for(const e of entries){
    if(e.date > t || !e.post || e.vOnly) continue;
    // 고정 출연자: 하루 지나서 기록 (그날 '안 옴'을 고칠 시간), 안 온 날·옮긴 원래 날은 기록 안 함
    if(e.reg && (e.date >= t || e.regSt==='no' || e.regSt==='moved')) continue;
    const k = e.post.id + '|' + e.date;
    if(histSent[k]) continue;
    const s = e.slides[e.start||0];
    const item = {t: histText(e), u: e.post.permalink||'', i: s ? s.url : ''};
    ((add[e.prog.slug] = add[e.prog.slug] || {})[e.date] = add[e.prog.slug][e.date] || []).push(item);
    histSent[k] = 1; n++;
  }
  if(n){ pushSync({hist:add}); store.set('histSent', histSent); }
}

function saveKeep(){
  if(!syncUrl || !syncOk) return;
  const add = {}, t = today();
  const items = [...entries, ...unknown.filter(e=>e.guess && e.far)];
  for(const e of items){
    if(e.link || e.vOnly || !e.post || !e.post.permalink || e.post._kept) continue;
    const id = e.post.id, d = e.date || e.guess;
    if(!d || d < weekStart(t)) continue;
    const a = add[id] || (add[id] = {slug:e.prog.slug, until:d, dates:{}, post:null});
    if(d > a.until) a.until = d;
    a.dates[d] = {s:e.start||0, w:e.weekly?1:0, m:(e.manual||e.confirmed)?1:0};
    if(!a.post){
      const q = e.post;
      a.post = {permalink:q.permalink, caption:(q.caption||'').slice(0,1500), timestamp:q.timestamp, media_type:q.media_type,
        media_url:q.media_url, thumbnail_url:q.thumbnail_url, children:q.children, username:q.username,
        _yt:q._yt||undefined, _ig:q._ig||undefined};
    }

    const sig = add[id].until + '|' + Object.keys(add[id].dates).sort().join(',');
    const old = keepData[id], oldSig = old && (old.until + '|' + Object.keys(old.dates||{}).sort().join(','));
    if(keepSent[id] === sig || oldSig === sig) continue;
    keepSent[id] = sig; send[id] = add[id];

}

const ocrNew = {};   // 이번에 새로 읽은 결과 → 저장소로 공유
function shareOcr(){ const k = Object.keys(ocrNew); if(!k.length) return; const b = {}; k.forEach(x=>{ b[x]=ocrNew[x]; delete ocrNew[x]; }); pushSync({ocr:b}); }
async function runOcr(){
  if(ocrBusy || !ocrQueue.length) return;
  ocrBusy = true;
  ocrQueue.sort((a,b)=>a.ts<b.ts?1:-1);
  const total = ocrQueue.length; let done = 0;
  setStatus(`사진 속 날짜 읽는 중… 0/${total}`, 0);
  try{
    if(!workers.length) workers = await Promise.all([1,2].map(()=>Tesseract.createWorker('kor+eng')));
    await Promise.all(workers.map(async w=>{
      while(ocrQueue.length){
        const s = ocrQueue.shift();
        if(!(s.id in ocrCache)){
          try{ const {data} = await w.recognize(s.url); ocrCache[s.id] = data.text || ''; }
          catch(e){ ocrCache[s.id] = ''; }
          ocrNew[s.id] = ocrCache[s.id];
          store.set('ocrCache', pruneCache(ocrCache));
        }
        done++;
        setStatus(`사진 속 날짜 읽는 중… ${done}/${total}`, done/total);
        if(done%3===0) rebuild(false, false);
        if(done%5===0) shareOcr();
      }
    }));
  }catch(e){ setStatus('사진 글자 읽기를 시작하지 못했어요 — 본문 날짜만 사용 중'); }
  ocrBusy = false;
  shareOcr();
  rebuild(false, false);
}
function pruneCache(c){ const k=Object.keys(c); if(k.length>600) k.slice(0,k.length-600).forEach(x=>delete c[x]); return c; }

// 게시물 탭 이름: 주간 편성표 / 출연자 이름 / 유튜브 일정 …
function postLabel(e){

  if(e.weekly) return '주간 편성표';

function bentoHTML(p, es){

    rows = es.map((e,i)=>i===wi?'':browHTML(e, ks[i])).join('');   // 주간표는 중복이라 목록에서 뺌
  } else {
    // 주간표가 없으면: 출연자 전원을 같은 크기로 나란히 (한 명만 나오는 것처럼 보이지 않게)
    const sh = es.slice(0,4), more = es.length - sh.length;

    }).join('')}</div>`;
    rows = es.map((e,i)=>browHTML(e, ks[i])).join('');

  return `<section class="pc grp bentocard ${allDone?'done':''}" id="p-${p.slug}" data-slug="${p.slug}" style="--pc:${p.color}" data-ks="${ks.join(',')}" data-key="${esc(p.slug+'|'+selDay)}" data-u="">
    <div class="pch">${p.logo?`<img class="lg" src="${p.logo}" alt="">`:''}

        <div class="l1"><span class="tm">${fmtTime(p.start)}</span>${p.ch?`<span class="ch">${p.ch}</span>`:''}${progPills(p, es)}<span class="pill bcn" title="이 프로그램 게시물 ${es.length}개">${es.length}개</span></div></div>
    </div>
    <div class="pcb"><div class="bento">${media}</div>
      <div class="bft">${rows}</div></div>${stamp}
  </section>`;
}

const reducedMo = () => matchMedia('(prefers-reduced-motion:reduce)').matches;
// 카드 사진 넘기기: 휴대폰 자체 스크롤(스냅)로 움직여서 화면 주사율(120Hz) 그대로 부드럽게
function tileGo(tile, d){
  const trk = tile.querySelector('.trk'); if(!trk) return;
  const e = viewList[+tile.dataset.k], n = e.slides.length, W = trk.clientWidth || 1;
  const cur = trk._tgt!=null && Date.now()-trk._tgtT < 1200 ? trk._tgt : Math.round(trk.scrollLeft / W);
  const i = Math.max(0, Math.min(n-1, cur + d)); if(i===cur) return;
  trk._tgt = i; trk._tgtT = Date.now();
  trk.scrollTo({left: i*W, behavior: reducedMo() ? 'auto' : 'smooth'});
  tileSet(tile, i);
}
function tileSet(tile, i){
  const e = viewList[+tile.dataset.k], n = e.slides.length;
  pos[tileKey(e)] = i;
  const c = tile.querySelector('.cnt b'); if(c) c.textContent = i+1;
  const pv = tile.querySelector('.tnav.prev'), nx = tile.querySelector('.tnav.next');
  if(pv) pv.disabled = i<=0; if(nx) nx.disabled = i>=n-1;
  const pcEl = tile.closest('.pc'); if(pcEl) pcEl.classList.toggle('away', i>0);
  armRewind(tile);
}
// 카드에서 넘겨본 뒤 5초 동안 가만히 두면 첫 장으로 스르륵 돌아감 (마우스를 올려두고 보는 중이면 기다림)
function armRewind(tile){
  clearTimeout(tile._rwT);
  const pcEl = tile.closest('.pc'), e = viewList[+tile.dataset.k];
  if(pcEl){ pcEl.classList.remove('rwt'); void pcEl.offsetWidth; }
  if(!e || tileIdx(e)<=0) return;
  if(pcEl) pcEl.classList.add('rwt');
  tile._rwT = setTimeout(() => {
    if(!document.body.contains(tile)) return;
    if(tile.matches(':hover') || vw.classList.contains('on')) return armRewind(tile);
    const i = tileIdx(viewList[+tile.dataset.k]);
    if(pcEl) pcEl.classList.remove('rwt');
    if(i>0) tileGo(tile, -i);
  }, 5000);
}

function bindCards(){
  document.querySelectorAll('.pc').forEach(pc=>{
    const ks = pc.dataset.ks.split(',').map(Number), isU = !!pc.dataset.u;
    pc.querySelectorAll('.tabs.multi .pt').forEach(b=>b.onclick=()=>{
      const j = +b.dataset.j; postPos[pc.dataset.key] = j;
      const ev = viewList[ks[j]];
      pc.querySelectorAll('.pt').forEach(x=>x.classList.toggle('on', x===b));
      const es2 = ks.map(k=>viewList[k]);
      pc.querySelector('.pcb').innerHTML = bodyHTML(ev, ks[j], isU) + storyHTML(es2, j);
      bindBody(pc);
    });
    if(pc.querySelector('.tile')) bindBody(pc);
    // 사진 바로 위 띠를 누르면 첫 장으로 (멀리 넘겨봤을 때)
    pc.querySelectorAll('.tabs:not(.multi)').forEach(bar=>{ bar.onclick = ev => {
      const tl = pc.querySelector('.tile'); if(!tl) return; const e = viewList[+tl.dataset.k], i = tileIdx(e);
      if(i>0){ ev.stopPropagation(); tileGo(tl, -i); }

    pc.querySelectorAll('.brow .ic').forEach(ic=>{ ic.onclick = ev => ev.stopPropagation(); ic.onkeydown = ev => ev.stopPropagation(); ic.querySelectorAll('button[data-a]').forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); doAct(ic.dataset.id, b.dataset.a, b.dataset.g); }); });
    pc.querySelectorAll('.brow, .bs1').forEach(hoverPreview);   // 추가 게시물 칸 어디든 (주간표 제외)
    pc.querySelectorAll('.bp, .brow, .bs1').forEach(el=>{
      el.onclick = () => { if(el._lp && Date.now()-el._lp<700) return; const k = +el.dataset.k; openView(k, tileIdx(viewList[k])); };
      el.onkeydown = ev => { if(ev.key==='Enter' || ev.key===' '){ ev.preventDefault(); el.click(); } };
    });
  });
}
/* 마우스를 올리면(클릭 없이) 사진이 크게 떠서 보이고, 마우스가 벗어나면 사라짐 (PC 전용) */

// 유튜브 주간 일정 글에서 그날 부분만 꺼냄 ("10/7(수) - 20:00 … - 22:00 …")
function snipLines(text, ymd){
  if(!text) return null;
  const m = +ymd.slice(5,7), d = +ymd.slice(8);
  const re = new RegExp(`(?<![\\d/])0?${m}\\s*[/.]\\s*0?${d}(?!\\d)`);
  const hit = re.exec(text); if(!hit) return null;
  let body = text.slice(hit.index);
  const next = /(?<![\d/])\d{1,2}\s*[\/.]\s*\d{1,2}\s*\(/g; next.lastIndex = hit[0].length;
  const n = next.exec(body); if(n) body = body.slice(0, n.index);
  body = body.replace(/[\u{1F300}-\u{1FAFF}←-⇿⬀-⯿☀-➿️♥♡]/gu,' ').replace(/\s*-\s*(?=\d{1,2}:\d{2})/g,'\n').replace(/[ \t]+/g,' ').trim();
  const lines = body.split('\n').map(x=>x.trim()).filter(x=>x && x!=='-');
  if(lines.length<2) return null;
  return {head:lines[0], lines:lines.slice(1)};
}
function daySnippet(text, ymd){
  const s = snipLines(text, ymd); if(!s) return '';
  return `<div class="snip"><b>${esc(s.head)}</b>${s.lines.map(l=>`<div>${esc(l).replace(/^(\d{1,2}:\d{2})/,'<span class="tm">$1</span>')}</div>`).join('')}</div>`;
}

}

// "10/16 14:00", "10월 16일 오후 2시", "10/16" → {d, tm}
function parseVisit(v){
  const m = /(\d{1,2})\s*[\/.월-]\s*(\d{1,2})\s*일?/.exec(v); if(!m) return null;
  const ds = findDates(`${+m[1]}/${+m[2]}`, today()); if(!ds.length) return null;
  const rest = v.slice(m.index + m[0].length);
  const t = /(오전|오후|밤|저녁|아침)?\s*(\d{1,2})\s*(?::|시)\s*(\d{1,2})?\s*(분|반)?/.exec(rest);
  let tm = '';
  if(t){ let H = +t[2], M = t[4]==='반' ? 30 : +(t[3]||0);
    if(/오후|밤|저녁/.test(t[1]||'') && H<12) H += 12;
    if(H<24 && M<60) tm = `${String(H).padStart(2,'0')}:${String(M).padStart(2,'0')}`; }
  return {d:ds[0], tm};
}

  const keepMemo = overrides[id] && overrides[id].memo ? {memo:overrides[id].memo} : {};
  if(a==='done' || a==='undone'){
    const o = {...(overrides[id]||{})}, dn = {...(o.dn||{})};
    if(a==='done') dn[g] = 1; else delete dn[g];
    if(Object.keys(dn).length) o.dn = dn; else delete o.dn;
    o.t = now; overrides[id] = o;
    if(Object.keys(o).every(k=>k==='t')) delete overrides[id];
  }
  if(a==='hide') overrides[id]={hide:true, t:now};
  if(a==='v2d'){
    const o = {...(overrides[id]||{})}; if(!o.visit) return false;
    const d = o.visit.d, bc = bcDates(o, id); delete o.visit; delete o.vdKeep; delete o.unk; delete o.unkD;
    overrides[id] = {...o, dates:[...new Set([...bc, d])].sort(), t:now};
  }
  if(a==='unk'){
    if(!confirm('이 게시물을 달력에서 빼서 "확인 필요"로 옮길까요?\n(나중에 확인 필요에서 ✓ 맞음을 누르면 다시 달력으로 돌아와요)')) return false;
    const ds = [...new Set(entries.filter(x=>x.post && (x.post.id===id || x.post._oid===id) && x.date).map(x=>x.date))].sort();
    const o = {...(overrides[id]||{})}; delete o.dates; delete o.date; delete o.vdKeep; delete o.hide;
    overrides[id] = {...o, unk:1, unkD:ds, t:now};
  }
  if(a==='ok'){ const o = overrides[id]; overrides[id]={dates:g.split(','), t:now, ...(o&&o.visit?{visit:o.visit, vdKeep:true}:{}), ...(o&&o.dn?{dn:o.dn}:{}), ...keepMemo}; }
  if(a==='reset' || a==='del') delete overrides[id];
  if(a==='visit'){
    const old = overrides[id] || {};
    const cur = old.visit ? `${+old.visit.d.slice(5,7)}/${+old.visit.d.slice(8)}${old.visit.tm?' '+old.visit.tm:''}` : '';
    const v = prompt('출연자가 실제로 오는 날짜와 시간을 입력하세요\n· 예: 10/16 14:00\n· 시간을 모르면: 10/16\n· 방문일 지우기: 삭제', cur);
    if(v==null || !v.trim()) return false;
    if(/삭제|지우|없음/.test(v)){ if(!old.visit) return false; const n = {...old}; delete n.visit; overrides[id] = {...n, t:now}; }
    else{
      const r = parseVisit(v); if(!r){ alert('날짜 형식을 확인해 주세요 (예: 10/16 14:00)'); return false; }
      const n = {...old}; delete n.hide;
      if(n.visit && !n.link && n.dates && n.dates.length===1 && n.dates[0]===n.visit.d && !n.vdKeep){   // 예전 방식 정리
        const bd = bcDates(n, id); if(bd.length) n.dates = bd; else delete n.dates; }
      overrides[id] = {...n, visit:r, t:now};
      selDay = diffDays(r.d, today())<=DAYS_AHEAD && r.d>=weekStart(today()) ? r.d : 'unknown';
    }
  }
  if(a==='date'){
    const v = prompt('방송 날짜를 입력하세요\n· 하루: 10/14\n· 여러 날: 10/14, 10/16\n· 기간: 11/9~11/14', '');
    if(!v) return false;
    const ds = findDates(v.replace(/[,，、]/g,' , '), today());
    if(!ds.length){ alert('날짜 형식을 확인해 주세요 (예: 10/14 또는 11/9~11/14)'); return false; }
    const old = overrides[id];
    overrides[id] = old && (old.link||old.guest) ? {...old, date:undefined, dates:ds, t:now} : {dates:ds, t:now, ...(old&&old.visit?{visit:old.visit, vdKeep:true}:{}), ...keepMemo};
  }
  pushSync(overrides[id] ? {set:{[id]:overrides[id]}, ...(a==='hide'?{unkeep:[id]}:{})} : {del:[id]});
  store.set('overrides', overrides); rebuild(false, true);
  return true;
}

// 글 속 "[수] 만남의 광장 / 육식맨" 같은 줄을 누르면 그날 사진으로 바로 이동
function daySlide(e, ymd){
  const n = e.slides.length; if(n<2) return -1;
  const posted = e.post.timestamp ? tsYmd(e.post.timestamp) : today();
  const sd = e.slides.map(s=>findDates(ocrCache[s.id]||'', posted));
  let i = sd.findIndex(ds=>ds.length===1 && ds[0]===ymd);
  if(i<0) i = sd.findIndex(ds=>ds.length>0 && ds.length<=2 && ds.includes(ymd));
  if(i>=0) return i;
  const r = e.range || (e.date ? [weekStart(e.date), addDays(weekStart(e.date),6)] : null);
  if(!r) return -1;
  const off = diffDays(ymd, r[0]), span = diffDays(r[1], r[0]) + 1;
  if(off<0 || off>=span) return -1;
  if(n === span+1) return off+1;      // 첫 장 표지 + 하루 한 장
  if(n === span) return off;
  return -1;
}
function capLinks(e){
  const text = e.post.caption || '';
  if(e.slides.length<2) return esc(text);
  const posted = e.post.timestamp ? tsYmd(e.post.timestamp) : today();
  const base = e.range ? e.range[0] : (e.date || posted);
  const WK = '일월화수목금토';
  return text.split('\n').map(line=>{
    let ymd = null;
    const w = /^\s*[\[(【<]?\s*([월화수목금토일])(?:요일)?\s*[\])】>]/.exec(line) || /^\s*([월화수목금토일])요일/.exec(line);
    if(w){ const wi = WK.indexOf(w[1]); ymd = addDays(weekStart(base), (wi+6)%7); }
    else { const ds = findDates(line, posted); if(ds.length===1) ymd = ds[0]; }
    const i = ymd ? daySlide(e, ymd) : -1;
    return i>=0 ? `<a class="go" data-i="${i}" title="${i+1}번째 사진으로">${esc(line)}<span class="gi">${i+1}/${e.slides.length} ›</span></a>` : esc(line);
  }).join('\n');
}

// 기록은 이 기기(IndexedDB)에 저장해 두고 바로 씀 → 뒤에서 조용히 최신으로 바꿈
const idb = (()=>{ let p; const open = () => p || (p = new Promise((res,rej)=>{ const r = indexedDB.open('radio-guests', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
  return {
    get: k => open().then(db=>new Promise(res=>{ const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); })).catch(()=>undefined),
    set: (k,v) => open().then(db=>new Promise(res=>{ const t = db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete = res; t.onerror = res; })).catch(()=>{})
  }; })();
function fetchHist(){
  if(histFetching) return histFetching;
  histFetching = (async()=>{
    try{
      const r = await fetch(syncUrl + (syncUrl.includes('?')?'&':'?') + 'v=hist&t=' + Date.now());
      const j = (await r.json()).hist || {};
      histData = j; histAt = Date.now(); nameIdxCache = null;
      idb.set('hist', {at: histAt, data: j});
      if($('sr').classList.contains('on')) doSearch();      // 열려 있으면 최신으로 다시 보여줌
      else setTimeout(()=>nameIndex(histData), 50);
    }catch(e){ histData = histData || {}; }
    histFetching = null; return histData;
  })();
  return histFetching;
}
async function loadHist(){
  if(!histData){
    const c = await idb.get('hist');
    if(c && c.data){ histData = c.data; histAt = c.at || 0; }
  }
  if(!histData) return fetchHist();                       // 처음 한 번만 기다림
  if(Date.now()-histAt > 5*6e4) fetchHist();              // 오래됐으면 뒤에서 새로 받기
  return histData;
}

// 집 PC(확장 프로그램 있는 곳)에서 열면: 마지막으로 받은 편성표 날짜 다음날 ~ 어제 출연자를 조용히 자동 저장
function autoSched(){
  if((document.documentElement.dataset.igCollector||'') < '2.3' || !histData) return;
  let newest = '';
  for(const s in histData){ if(s==='_names') continue; for(const d in histData[s]) if(d > newest && histData[s][d].some(x=>typeof x==='string' && x.startsWith('🎙'))) newest = d; }
  if(!newest) return;
  const t = today(), gap = diffDays(t, newest) - 1;      // 받아야 할 날 수 (어제까지)
  if(gap < 1) return;
  window.postMessage({rg:'sched', days: Math.min(gap, 60), before: t}, '*');
}

const NAME_STOP = /^(dj|스페셜|게스트|출연|출연자|특별|초대석|초대|코너|생방송|생방|녹음|보라|보는라디오|라디오|방송분|방송|다시듣기|하이라이트|with|feat|외|등|및|그리고|특집|라이브|live|sbs|파워fm|러브fm|월|화|수|목|금|토|일)$/i;
function namesOf(t){
  t = t.split(' ‖ ')[0].replace(/^[🎙🎬📸]\s*/u,'').replace(/\[[^\]]*라디오[^\]]*\]|\[[^\]]*컬투쇼[^\]]*\]/g,' ')
    .replace(/\d{4}년\s*\d{1,2}월\s*\d{1,2}일|\d{1,2}월\s*\d{1,2}일|\d{1,2}\/\d{1,2}|\([월화수목금토일]\)/g,' ');
  const out = [];
  t.split(/[\/,·|&+:：()\[\]{}<>「」『』"'“”‘’!?~♥♡★☆]|\s+[xX×]\s+|\s+with\.?\s*|\s+feat\.?\s*|\s{2,}/i).forEach(seg=>{
    seg.trim().split(/\s+/).forEach(w=>{
      w = w.replace(/^[^0-9A-Za-z가-힣]+|[^0-9A-Za-z가-힣]+$/g,'').replace(/(씨|님|양|군)$/,'');
      if(w.length<2 || w.length>16 || /^\d+$/.test(w) || NAME_STOP.test(w)) return;
      out.push(w);
    });
  });

}
function nameIndex(H){
  if(nameIdxFor === H && nameIdxCache) return nameIdxCache;
  const names = {}, recs = [];
  for(const s in H){ if(s==='_names') continue;
    for(const d in H[s]){
      const keys = new Set(), texts = [];
      for(const x of H[s][d]){ const t = typeof x==='string' ? x : x.t; texts.push(t); namesOf(t).forEach(w=>keys.add(w.toLowerCase())); }
      keys.forEach(k=>{ const c = names[k] || (names[k] = {key:k, label:k, n:0}); c.n++; });
      recs.push({s, d, t:texts.join(' / '), x:texts[0], keys});
    }
  }
  // 표시용 이름은 원래 글자(대소문자) 그대로
  for(const r of recs) namesOf(r.t).forEach(w=>{ const c = names[w.toLowerCase()]; if(c && c.label===c.key) c.label = w; });
  nameIdxFor = H; nameIdxCache = {names, recs};
  return nameIdxCache;
}

  // 같은 날·같은 프로그램은 한 줄로

];
(function(){
  const svg = $('mysig'); if(!svg) return;
  const NS = 'http://www.w3.org/2000/svg';
  const lens = STROKES.map(d=>{ const p=document.createElementNS(NS,'path'); p.setAttribute('d',d); svg.appendChild(p); const L=p.getTotalLength(); p.remove(); return L; });
  const total = lens.reduce((a,b)=>a+b,0), dur = 1.9;
  let t = 0, html = '<g class="glow">';
  STROKES.forEach((d,i)=>{ const dd = dur*lens[i]/total; html += `<path class="ink" pathLength="1" d="${d}" style="--d:${dd.toFixed(2)}s;--t:${t.toFixed(2)}s"/>`; t += dd*0.92; });
  html += `</g><path class="spark" d="M724,150 l5,11 11,5 -11,5 -5,11 -5,-11 -11,-5 11,-5z" style="transform-origin:724px 166px"/>`;
  svg.innerHTML = html; svg.style.setProperty('--total', t.toFixed(2)+'s');

  // 마우스가 머무는 동안 계속 반복 (그리고 → 잠깐 빛나고 → 다시 그리기)
  let loop = null;
  const start = () => { if(loop) return; play(); loop = setInterval(play, (t + 1.6) * 1000); };

/* ---------- SBS 일일 편성표 (그날 출연자) ---------- */
const schCache = {};
const LOVE_SKIP = /(yesterday|love|oldies|예스터데이|러브|올디스)\s*20(?!\d)/i;
async function getSched(d){
  if(schCache[d]) return schCache[d];
  const [y,m,dd] = d.split('-').map(Number);
  let out = null;
  try{   // 1) SBS에서 바로
    const one = async ch => { const r = await fetch(`https://static.cloud.sbs.co.kr/schedule/${y}/${m}/${dd}/${ch}.json`); if(!r.ok) return []; let j = await r.json(); if(!Array.isArray(j)){ const k = Object.keys(j||{}).find(k=>Array.isArray(j[k])); j = k ? j[k] : []; } return j.map(it=>({s:it.start_time||'', e:it.end_time||'', t:it.title||'', g:it.guest||it.bora_title||'', b:it.is_bora||'', c:it.programcode||''})); };
    out = {Power: await one('Power'), Love: await one('Love')};
  }catch(e){ out = null; }
  if(!out || (!out.Power.length && !out.Love.length)){   // 2) 안 되면 저장소를 통해서
    try{ out = await (await fetch(syncUrl + (syncUrl.includes('?')?'&':'?') + 'v=sched&d=' + d)).json(); }catch(e){ out = null; }
  }
  if(out && (out.Power||[]).length + (out.Love||[]).length) schCache[d] = out;
  return out;
}
let schDay = today();
function schParse(list, love){
  const seen = new Set();
  return (list||[]).map(it=>{
    const t = String(it.t||'').replace(/\s+/g,' ').trim(); if(!t || (love && LOVE_SKIP.test(t))) return null;
    const mm = /(\d{1,2}):(\d{2})/.exec(it.s||''); const time = mm ? String(+mm[1]).padStart(2,'0')+':'+mm[2] : '';
    const k = time+'|'+t; if(seen.has(k)) return null; seen.add(k);
    const bora = /^(y|yes|1|true)$/i.test(String(it.b||'').trim());
    const g = String(it.g||'').replace(/<[^>]+>/g,' ').replace(/^\s*(\[?\s*(보는\s*라디오|보라)\s*\]?\s*[:：·|,]?\s*)+/,'').replace(/\s+/g,' ').trim();
    return {time, t, bora, live: bora || /생방|뉴스/.test(t), g, mine: progs.find(p=>p.slug===it.c || p.name===t)};
  }).filter(Boolean);
}
function schRows(list, love){
  const rows = schParse(list, love);
  const now = new Date(Date.now()+9*36e5).toISOString().slice(11,16);
  return rows.map((r,i)=>{
    const next = rows[i+1] ? rows[i+1].time : '99:99';
    const onair = schDay===today() && r.time && r.time <= now && now < next;
    return `<div class="sr2 ${r.g?'hasg':''} ${onair?'onair':''}" ${r.mine?`style="--pc:${r.mine.color}"`:''}>
      <span class="tm">${r.time}</span>
      <span class="ti">${r.bora?'<i class="bo">보라</i>':''}${r.mine&&r.mine.logo?`<img src="${r.mine.logo}" alt="">`:''}<b>${esc(r.t)}</b>${onair?'<i class="oa">ON AIR</i>':''}</span>
      <span class="gu">${r.g?esc(r.g):'<em>—</em>'}</span>
    </div>`;
  }).join('') || '<div class="schempty">편성 정보가 없어요</div>';
}

/* 2019년 이전 채우기: 오래된 장수 프로그램 7개의 다시듣기에서 2016.10 ~ 2019.12 기간만 */
const OLD_PROGS = [/컬투쇼/, /러브게임/, /이숙영|러브FM/, /배성재의\s*텐/, /김영철의\s*파워FM/, /씨네타운/, /영스트리트/];
async function startRangeCrawl(){
  await loadHist();
  const H = histData || {}, names = H._names || {}, list = [], seen = new Set();
  const add = (slug, name) => { if(!slug || slug.startsWith('T:') || seen.has(slug)) return; seen.add(slug); list.push({slug, name}); };
  for(const re of OLD_PROGS){
    progs.filter(p=>re.test(p.name)).forEach(p=>add(p.slug, p.name));
    Object.entries(names).filter(([c,t])=>re.test(t)).forEach(([c,t])=>add(c, t));   // 진행자가 바뀌기 전 옛 프로그램 코드도
  }
  const kst = new Date(Date.now()+9*36e5).toISOString().slice(0,10);
  const from = addDays(kst, -3650), to = '2019-12-30';
  // 2020년 2월 이후에 시작한 프로그램(새 진행자 홈페이지)은 2019년 자료가 있을 수 없으니 건너뜀
  const first = s => { const ds = Object.keys(H[s]||{}).sort(); return ds[0] || ''; };
  for(let i=list.length-1;i>=0;i--){ const f = first(list[i].slug); if(f && f > '2020-02-01') list.splice(i,1); }
  if(!confirm(`장수 프로그램의 다시듣기에서 ${from} ~ ${to} 출연 기록을 채울까요?\n\n${list.map(p=>'· '+p.name).join('\n')}\n\n2020년 이후는 편성표로 이미 있어서 건너뛰어요. 프로그램마다 몇 분씩 걸려요 (창은 열어두세요).`)) return;
  histRun = {done:1, total:list.length, user:'준비 중'}; showHistToast();
  window.postMessage({rg:'range', progs:list, from, to}, '*');
}

/* 편성표 출연자 10년치 (SBS 편성표 데이터 — 날짜별로 바로 받아서 빠름) */
function startSchedCrawl(){
  if(!confirm('SBS 편성표에서 지난 10년 동안의 프로그램별 출연자를 모아 올까요? (이미 받은 날짜는 건너뛰고 그 이전부터 이어서 받아요)\n\n파워FM·러브FM 전체 · 10~20분쯤 걸려요. 그동안 이 창은 열어두세요. (이미 받은 기록은 중복 없이 합쳐져요)')) return;
  // 이미 받은 편성표 기록이 있으면 그 이전 날짜부터 이어서 (10년 전까지)
  let oldest = '';
  const H = histData || {};
  for(const s in H){ if(s==='_names') continue; for(const d in H[s]) if(H[s][d].some(x=>typeof x==='string' && x.startsWith('🎙')) && (!oldest || d < oldest)) oldest = d; }
  const kst = new Date(Date.now()+9*36e5).toISOString().slice(0,10);
  const limit = addDays(kst, -3650);
  const before = oldest && oldest > limit ? oldest : '';
  const days = before ? diffDays(before, limit) : 3650;
  histRun = {done:0, total:days, user:'준비 중', kind:'편성표'}; showHistToast();
  window.postMessage({rg:'sched', days, before}, '*');
}
window.addEventListener('message', e=>{

    if(m.total <= 60) return;   // 자동 하루치 저장은 조용히
    setStatus(`편성표 출연자 가져오는 중… ${m.user} (${m.done}/${m.total}일)`, m.done/m.total);
    if(m.done % 360 < 6) fetchHist();
  }
  if(m.type==='sdone'){
    const r = m.result||{};
    fetchHist(); return;   // 자동 저장은 알림 없이 기록만 새로
    const msg = r.busy ? '이미 가져오는 중이에요' : `✅ 편성표 출연자 가져오기 완료 — ${(r.total||0).toLocaleString()}건 · ${r.days||0}일치` + (r.oldest?` (가장 오래된 날 ${r.oldest})`:'') + (r.err?` · 오류: ${r.err}`:'');
    setStatus(msg); if(!r.busy) alert(msg);
  }
});

};
$('add').onclick = () => {
  const link = (prompt('인스타(또는 유튜브) 게시물 링크를 붙여넣으세요') || '').trim();
  if(!/^https?:\/\//.test(link)) return;
  const list = progs.map((p,i)=>`${i+1}. ${p.name}`).join('\n');
  const n = +prompt('어느 프로그램인가요? 번호를 입력하세요\n\n' + list, '');
  const p = progs[n-1]; if(!p) return;
  const ds = findDates((prompt('방송 날짜\n· 하루: 10/14\n· 여러 날: 10/14, 10/16\n· 기간: 11/9~11/14', '') || '').replace(/[,，、]/g,' , '), today());
  if(!ds.length){ alert('날짜 형식을 확인해 주세요 (예: 10/14 또는 11/9~11/14)'); return; }
  const d = ds[0];
  const note = prompt('메모 (출연자 이름 등, 비워도 돼요)', '') || '';
  const vt = ds.length===1 ? prompt('출연자가 실제로 오는 날이면 시간을 입력하세요 (예: 14:00)\n· 시간 모르면: 그냥 확인\n· 방문일이 아니면: 취소', '') : null;
  const vr = vt==null ? null : (parseVisit(`${+d.slice(5,7)}/${+d.slice(8)} ${vt}`) || {d, tm:''});
  const id = 'link_' + Date.now().toString(36);
  overrides[id] = {link, slug:p.slug, dates:ds, note, t:Date.now(), ...(vr?{visit:vr}:{})};
  pushSync({set:{[id]:overrides[id]}}); store.set('overrides', overrides);
  selDay = diffDays(d, today())<=DAYS_AHEAD ? d : 'unknown';
  rebuild(false, true);
};
$('info').onclick = () => {
  $('when').textContent = '프로그램 상태'; $('jump').innerHTML='';
  const rows = progs.map(p=>{
    const ago = ts => { if(!ts) return ''; const m = Math.round((Date.now()-ts)/6e4); return m<60 ? `${m}분 전` : m<1440 ? `${Math.round(m/60)}시간 전` : `${Math.round(m/1440)}일 전`; };
    const sbs = p.igOnly ? '<span style="color:var(--faint)">홈페이지 없음</span>'
      : p.err ? `<span class="bad">${p.err}</span>`
      : p.latest && diffDays(today(),p.latest)>30 ? `<span class="bad">멈춤 (${p.latest})</span>`
      : `<span class="ok">정상</span> ${p.latest||''}`;
    const ig = p.igAt ? (Date.now()-p.igAt > 6*36e5 ? `<span style="color:var(--warn);font-weight:700">${ago(p.igAt)}</span>` : `<span class="ok">정상</span> ${ago(p.igAt)}`)
      : p.ig ? `<span style="color:var(--warn);font-weight:700">📷 수집 필요</span>` : `<span style="color:var(--faint)">계정 없음</span>`;
    const yt = p.youtube ? `<br>유튜브: ${p.ytErr ? `<span class="bad">${esc(p.ytErr)}</span>` : p.ytAt ? `<span class="ok">정상</span> ${ago(p.ytAt)}` : '<span style="color:var(--warn);font-weight:700">저장소 업데이트 필요</span>'}` : '';
    return `<tr><td><span class="sw" style="background:${p.color}"></span></td><td><b>${fmtTime(p.start)}</b></td><td>${esc(p.name)}<br><small style="color:var(--faint)">@${esc(p.ig||'')}</small></td><td>${p.ch}</td><td>홈페이지: ${sbs}<br>인스타: ${ig}${yt}</td></tr>`;
  }).join('');
  $('main').innerHTML = `<div class="side" style="border-left-color:var(--acc)"><h3>프로그램 상태</h3>
    <table class="st">${rows}</table>
    <h3 style="margin-top:18px">프로그램 추가</h3>
    <p>SBS 홈페이지에서 프로그램 화면을 열고 주소를 붙여넣으세요. (예: programs.sbs.co.kr/radio/<b>cultwoshow</b>/main) 인스타 계정은 있으면 적어주세요.</p>
    <div class="act" style="margin-top:8px">
      <input id="np_url" placeholder="홈페이지 주소" style="flex:2;min-width:220px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)">
      <input id="np_ig" placeholder="인스타 계정 (예: sbs.power)" style="flex:1;min-width:150px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)">
      <button id="np_add" style="color:#fff;background:var(--acc);border-color:var(--acc);font-weight:700">추가</button>
    </div>
    ${progs.filter(p=>p.added).length ? `<p style="margin-top:8px">추가한 프로그램: ${progs.filter(p=>p.added).map(p=>`<b>${esc(p.name)}</b> <button class="np_del" data-s="${p.slug}" style="font-size:11px;border:1px solid var(--line);border-radius:6px;background:none;color:var(--sub);cursor:pointer">삭제</button>`).join(' · ')}</p>` : ''}
    <h3 style="margin-top:18px">기기 간 연동</h3>
    <p>${syncUrl ? (syncOk===false ? '<span class="bad">연동 주소에 접속이 안 돼요</span>' : '<span class="ok">연동됨</span> — 숨기기·날짜 지정이 모든 기기에 똑같이 적용돼요.') : '연동 안 됨 — 숨기기·날짜 지정이 이 기기에만 저장돼요.'}</p>
    ${SYNC_URL ? '' : `<div class="act" style="margin-top:8px"><input id="surl" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(syncUrl)}" style="flex:1;min-width:240px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)"><button id="ssave">연동 주소 저장</button></div>`}
    <div class="act" style="margin-top:10px"><button id="clr">숨기기·날짜 수정 초기화</button><button id="back">← 돌아가기</button></div></div>`;
  $('clr').onclick=()=>{ if(!confirm('숨기기·날짜 수정을 모두 초기화할까요?' + (syncUrl?' (모든 기기에 적용)':''))) return; overrides={}; store.set('overrides',overrides); pushSync({clear:true}); rebuild(false, true); };
  if($('ssave')) $('ssave').onclick=async()=>{
    syncUrl = $('surl').value.trim(); store.set('syncUrl', syncUrl);
    // 이 기기에서 이미 정리한 내용은 연동 저장소로 올려둠
    const local = {...overrides};
    if(syncUrl && await pullSync()){
      const add = {}; for(const k in local) if(!(k in overrides)){ overrides[k]=local[k]; add[k]=local[k]; }
      if(Object.keys(add).length) pushSync({set:add});
      store.set('overrides', overrides);
    }
    $('info').onclick();
  };
  $('back').onclick=render;
  if($('histgo')) $('histgo').onclick = startHistCrawl;
  if($('schedgo')) $('schedgo').onclick = startSchedCrawl;
  if($('rangego')) $('rangego').onclick = startRangeCrawl;
  $('np_add').onclick = async () => {
    const raw = $('np_url').value.trim(), ig = $('np_ig').value.trim().replace(/^@/,'').replace(/^https?:\/\/(www\.)?instagram\.com\//,'').replace(/[\/?].*$/,'');
    const m = /radio\/([A-Za-z0-9_\-]+)/.exec(raw) || /^([A-Za-z0-9_\-]+)$/.exec(raw);
    if(!m){ alert('홈페이지 주소를 확인해 주세요.\n예: https://programs.sbs.co.kr/radio/cultwoshow/main'); return; }
    const slug = m[1];
    if(progs.some(p=>p.slug===slug)){ alert('이미 있는 프로그램이에요.'); return; }
    $('np_add').disabled = true; $('np_add').textContent = '확인 중…';
    try{
      const info = (await getJSON(`${API}/program-api/1.0/menu/${slug}`)).program;
      const id = 'prog:' + slug;
      overrides[id] = {prog:true, slug, name:info.title, ig};   // t 없음 = 60일 자동정리 대상 아님
      pushSync({set:{[id]:overrides[id]}}); store.set('overrides', overrides);
      await loadAll(); alert(`'${info.title}' 추가 완료!`); $('info').onclick();
    }catch(e){ alert('SBS 홈페이지에서 이 프로그램을 찾지 못했어요. 주소를 확인해 주세요.'); $('np_add').disabled=false; $('np_add').textContent='추가'; }
  };
  document.querySelectorAll('.np_del').forEach(b=>b.onclick=async()=>{
    if(!confirm('이 프로그램을 목록에서 뺄까요?')) return;
    const id = 'prog:' + b.dataset.s; delete overrides[id];
    pushSync({del:[id]}); store.set('overrides', overrides); await loadAll(); $('info').onclick();
  });
};
loadAll();
</script>
</body>
</html>

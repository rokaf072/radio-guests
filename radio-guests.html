<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="icon" type="image/png" href="favicon.png?v=3">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="라디오 손님">
<title>라디오 손님</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0c10; --panel:#15171d; --panel2:#1c1f27; --ink:#f3f4f8; --sub:#a3a9b6; --faint:#6b7180; --line:#262a34;
  --acc:#7b8cff; --acc-ink:#fff; --warn:#f5b13d; --hot:#ff5a73; --chip:#232733; --shadow:0 10px 30px rgba(0,0,0,.45);
  --tw:200px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1200px 600px at 10% -10%,rgba(123,140,255,.10),transparent 60%),radial-gradient(900px 500px at 100% 0%,rgba(221,42,123,.08),transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:"Pretendard","Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit}

/* ---------- 상단 ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(11,12,16,.72);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid rgba(255,255,255,.06)}
.bar{max-width:1600px;margin:0 auto;padding:12px 16px 0;display:flex;align-items:center;gap:8px}
.bar h1{margin:0;font-size:20px;font-weight:900;letter-spacing:-.6px;flex:1;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bar h1 .when{font-size:14px;font-weight:700;color:var(--acc)}
.iconbtn{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:999px;height:34px;padding:0 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink)}
.iconbtn:hover{border-color:var(--acc);background:rgba(123,140,255,.10)}
.igbtn{background:linear-gradient(135deg,#f58529,#dd2a7b 55%,#8134af);color:#fff;border:0;font-weight:700}
.igbtn:hover{background:linear-gradient(135deg,#f58529,#dd2a7b 55%,#8134af);filter:brightness(1.1)}
.igbtn[disabled]{opacity:.75;cursor:wait}
.status{max-width:1600px;margin:0 auto;padding:3px 16px 0;font-size:12px;color:var(--faint);min-height:17px;display:flex;align-items:center;gap:8px}
.status .prog-bar{flex:0 0 120px;height:4px;border-radius:2px;background:var(--chip);overflow:hidden;display:none}
.status .prog-bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}

.days{max-width:1600px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:9px 16px 10px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;width:54px;border:1px solid transparent;background:rgba(255,255,255,.035);border-radius:14px;padding:6px 2px 6px;text-align:center;cursor:pointer;transition:transform .12s,background .12s}
.day:hover{transform:translateY(-1px);background:rgba(255,255,255,.07)}
.day .wd{font-size:11px;color:var(--sub);font-weight:600}
.day .dn{font-size:19px;font-weight:900;line-height:1.15;letter-spacing:-.5px}
.day .dots{display:flex;justify-content:center;gap:2px;height:6px;margin-top:3px}
.day .dots i{width:5px;height:5px;border-radius:50%}
.day.sun .wd,.day.sun .dn{color:var(--hot)} .day.sat .wd{color:var(--acc)}
.day.empty{opacity:.35}
.day.past{opacity:.55}
.day.past.empty{opacity:.22}
.day.today{border-color:rgba(123,140,255,.6)}
.day.on{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 6px 18px rgba(123,140,255,.35)}
.day.on .wd,.day.on .dn{color:#fff}
.day.chk{width:66px;border-color:rgba(245,177,61,.45)}
.day.chk .dn{font-size:17px;color:var(--warn)} .day.chk.on{background:var(--warn);border-color:var(--warn);box-shadow:0 6px 18px rgba(245,177,61,.3)} .day.chk.on .dn{color:#1a1200}

.jump{max-width:1600px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump:empty{display:none}
.jump button{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:999px;padding:2px 11px 2px 2px;cursor:pointer;font-size:12.5px;font-weight:700;transition:all .15s}
.jump button img{width:24px;height:24px;border-radius:50%;object-fit:cover;background:#fff}
.jump button:hover{border-color:var(--pc)}
.jump button.on{background:var(--pc);border-color:var(--pc);color:#fff}

/* ---------- 본문: 포스터 월 ---------- */
main{max-width:1600px;margin:0 auto;padding:18px 16px 90px}
.sec{font-size:16px;font-weight:900;margin:4px 0 14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.sec small{font-size:12.5px;font-weight:500;color:var(--sub)}
.wall+.sec{margin-top:34px}
.empty-msg{text-align:center;color:var(--sub);padding:80px 0 40px;font-size:15px}
.wall{display:flex;flex-wrap:wrap;gap:22px 16px;align-items:flex-start}
.grp{scroll-margin-top:var(--hh,200px);display:flex;flex-direction:column;gap:9px;max-width:100%}
.gh{display:flex;align-items:center;gap:8px;min-width:0;max-width:100%;padding-left:2px}
.gh img{width:32px;height:32px;flex:0 0 32px;border-radius:50%;object-fit:cover;background:#fff;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--pc)}
.gh .gt{min-width:0;flex:1}
.gh .l1{display:flex;align-items:center;gap:5px;flex-wrap:nowrap;overflow:hidden}
.gh .tm{font-size:13px;font-weight:900;color:color-mix(in srgb,var(--pc) 45%,#fff);letter-spacing:-.2px}
.gh .nm{font-size:14px;font-weight:800;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.tiles{display:flex;flex-wrap:wrap;gap:10px}

.pill{font-size:10.5px;font-weight:800;border-radius:999px;padding:2px 7px;background:var(--chip);color:var(--sub);white-space:nowrap;letter-spacing:-.2px}
.pill.hot{background:var(--hot);color:#fff}
.pill.week{background:#7c3aed;color:#fff}
.pill.yt{background:#e62117;color:#fff}
.pill.kp{background:#b45309;color:#fff}
.pill.ch{background:transparent;border:1px solid var(--line);color:var(--faint);padding:1px 6px}

.tile{position:relative;width:var(--tw);border-radius:16px;overflow:hidden;background:var(--panel);cursor:zoom-in;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 6px 18px rgba(0,0,0,.35);transition:transform .18s ease,box-shadow .18s ease;outline:none}
.tile:hover,.tile:focus-visible{transform:translateY(-4px);box-shadow:0 0 0 2px color-mix(in srgb,var(--pc) 70%,#fff),0 16px 34px rgba(0,0,0,.5)}
.tile .pic{position:relative;aspect-ratio:4/5;background:#000;overflow:hidden}
.tile .pic img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;transition:transform .35s ease}
.tile:hover .pic img{transform:scale(1.04)}
.tile .pic::after{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(transparent,rgba(0,0,0,.55));pointer-events:none}
.tile .cnt{position:absolute;left:8px;top:8px;z-index:2;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);color:#fff;font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 8px;display:flex;align-items:center;gap:4px}
.tile .tnav{position:absolute;top:44%;transform:translateY(-50%);z-index:3;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#111;font-size:20px;font-weight:800;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px rgba(0,0,0,.4);transition:transform .12s,opacity .15s}
.tile .tnav:hover{transform:translateY(-50%) scale(1.12);background:#fff}
.tile .tnav.prev{left:7px}.tile .tnav.next{right:7px}
.tile .tnav[disabled]{opacity:0;pointer-events:none}
.tile .cnt b{font-weight:900}
.tile .bdg{position:absolute;right:8px;top:8px;z-index:2;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.tile .zoom{position:absolute;z-index:2;left:50%;bottom:10px;transform:translateX(-50%);display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.92);color:#111;font-size:12px;font-weight:800;border-radius:999px;padding:5px 11px 5px 9px;box-shadow:0 4px 14px rgba(0,0,0,.35);white-space:nowrap;transition:transform .18s,background .18s}
.tile .zoom svg{width:14px;height:14px}
.tile:hover .zoom{transform:translateX(-50%) scale(1.06);background:#fff}
.tile .ft{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px}
.tile .rg{font-size:12.5px;font-weight:800;color:var(--ink);letter-spacing:-.2px}
.tile .up{font-size:11px;color:var(--faint)}
.tile .sn{font-size:11.5px;line-height:1.45;color:var(--sub);margin-top:2px}
.tile .sn b{color:#ffcf6b;font-weight:800;margin-right:4px}
.tile .q{display:flex;gap:5px;margin-top:6px}
.tile .q button{flex:1;font-size:11.5px;font-weight:700;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:9px;padding:5px 4px;cursor:pointer;color:var(--sub)}
.tile .q button.ok{background:var(--acc);border-color:var(--acc);color:#fff}
.tile .q button:hover{border-color:var(--acc)}
.tile.link .pic{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:linear-gradient(135deg,#f58529,#dd2a7b 50%,#8134af);color:#fff;font-weight:800;font-size:13px;text-align:center;padding:12px}
.tile.link .pic span{font-size:30px}
.tile .noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:#fff;font-weight:700;font-size:12.5px;background:linear-gradient(135deg,color-mix(in srgb,var(--pc) 80%,#000),#111)}

.side{background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:18px;margin-top:8px;border:1px solid var(--line)}
.side h3{margin:0 0 6px;font-size:16px;font-weight:900;display:flex;align-items:center;gap:8px}
.side p{margin:0;color:var(--sub);font-size:13.5px}
.side a{color:var(--acc);font-weight:700}
.act{display:flex;gap:6px;flex-wrap:wrap}
.act a,.act button{font-size:12.5px;font-weight:600;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:10px;padding:7px 12px;cursor:pointer;color:var(--sub);text-decoration:none}
.act a:hover,.act button:hover{border-color:var(--acc);color:var(--ink)}
.act .ig{color:#fff;background:linear-gradient(135deg,#f58529,#dd2a7b 55%,#8134af);border:0;font-weight:800}
.act .ig.ytb{background:#e62117}
.act .pri{color:#fff;background:var(--acc);border-color:var(--acc);font-weight:800}
table.st{width:100%;border-collapse:collapse;font-size:13.5px}
table.st td{padding:9px 6px;border-top:1px solid var(--line);vertical-align:middle}
table.st .sw{width:12px;height:12px;border-radius:50%;display:inline-block}
.ok{color:#22c55e;font-weight:700}.bad{color:var(--hot);font-weight:700}
.addbtn{position:fixed;right:18px;bottom:18px;z-index:30;border:0;border-radius:999px;background:var(--acc);color:#fff;font-weight:800;font-size:14px;padding:12px 18px;box-shadow:0 10px 26px rgba(123,140,255,.35);cursor:pointer}

/* ---------- 크게 보기 (상세 화면) ---------- */
.vw{position:fixed;inset:0;z-index:100;background:rgba(5,6,9,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:none;opacity:0;transition:opacity .18s}
.vw.on{display:flex;opacity:1}
.vw .stage{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 70px 10px}
.vw .stage .imgwrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.vw .stage img.big{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.6);user-select:none;-webkit-user-drag:none}
.vw .stage iframe{width:min(100%,520px);height:100%;border:0;border-radius:10px;background:#fff}
.vw .linkbig{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;width:min(90%,420px);aspect-ratio:4/5;border-radius:18px;background:linear-gradient(135deg,#f58529,#dd2a7b 50%,#8134af);color:#fff;font-weight:800;font-size:17px;text-decoration:none;text-align:center}
.vw .linkbig span{font-size:46px}
.vw .thumbs{display:flex;gap:6px;padding:12px 4px 2px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.vw .thumbs::-webkit-scrollbar{display:none}
.vw .thumbs img{width:48px;height:60px;object-fit:cover;object-position:top;border-radius:8px;opacity:.45;cursor:pointer;flex:0 0 auto;border:2px solid transparent;transition:opacity .15s}
.vw .thumbs img.on{opacity:1;border-color:#fff}
.vw .thumbs img:hover{opacity:.85}
.vw .snav{position:absolute;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#111;font-size:26px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(0,0,0,.4);z-index:3}
.vw .snav:hover{background:#fff}
.vw .snav.prev{left:12px}.vw .snav.next{right:12px}
.vw .snav[disabled]{opacity:0;pointer-events:none}
.vw .scount{position:absolute;top:22px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;font-size:12.5px;font-weight:800;border-radius:999px;padding:4px 11px;z-index:3}
.vw aside{width:380px;flex:0 0 380px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.vw .vh{padding:16px 18px 14px;display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--pc) 55%,#000),color-mix(in srgb,var(--pc) 22%,#111));}
.vw .vh img{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid #fff}
.vw .vh .t{flex:1;min-width:0}
.vw .vh h2{margin:0;font-size:18px;font-weight:900;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vw .vh .m{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;align-items:center}
.vw .vh .tmv{font-size:13px;font-weight:900;background:#fff;color:#111;border-radius:999px;padding:1px 8px}
.vw .x{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:22px;cursor:pointer;flex:0 0 auto}
.vw .x:hover{background:rgba(255,255,255,.28)}
.vw .vb{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.vw .dl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--sub)}
.vw .dl b{color:var(--ink);background:rgba(124,58,237,.28);border-radius:8px;padding:3px 9px;font-weight:800}
.vw .kept{font-size:12.5px;font-weight:700;color:#ffd08a;background:rgba(180,83,9,.22);border:1px solid rgba(180,83,9,.5);border-radius:10px;padding:8px 10px}
.vw .snip{background:rgba(255,207,107,.08);border:1px solid rgba(255,207,107,.25);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.6}
.vw .snip b{display:block;font-size:14.5px;margin-bottom:3px}
.vw .snip .tm{display:inline-block;min-width:46px;font-weight:900;color:#ffcf6b}
.vw .cap{font-size:13.5px;line-height:1.65;color:var(--sub);white-space:pre-wrap;word-break:break-word}
.vw .vf{border-top:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:8px}
.vw .vf .pn{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--faint)}
.vw .vf .pn button{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:12.5px;font-weight:700}
.vw .vf .pn button:hover{border-color:var(--acc)}
.vw .vf .pn button[disabled]{opacity:.3;pointer-events:none}
.vw .hint{font-size:11px;color:var(--faint);text-align:center;padding:0 0 10px}

@media (max-width:820px){
  :root{--tw:calc((100vw - 32px - 10px)/2)}
  .wall{gap:20px 10px}
  .vw{flex-direction:column}
  .vw .stage{flex:0 0 auto;height:62vh;padding:10px 8px 4px}
  .vw .snav{width:40px;height:40px;font-size:20px;background:rgba(255,255,255,.75)}
  .vw .snav.prev{left:6px}.vw .snav.next{right:6px}
  .vw aside{width:auto;flex:1;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0}
  .vw .hint{display:none}
}
@media (max-width:600px){
  .bar h1{font-size:18px}
  .day{width:48px}.day .dn{font-size:17px}
  .iconbtn{padding:0 10px}
}
@media (min-width:821px) and (max-width:1100px){ :root{--tw:180px} }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>라디오 손님 <span class="when" id="when"></span></h1>
    <button class="iconbtn igbtn" id="igc" title="집 PC 크롬에서만 보여요" style="display:none">📷 인스타 수집</button>
    <button class="iconbtn" id="reload" title="새로고침">↻ 새로고침</button>
    <button class="iconbtn" id="info" title="프로그램 상태">⚙</button>
  </div>
  <div class="status"><span class="prog-bar" id="pbar"><i></i></span><span id="status"></span></div>
  <div class="days" id="days"></div>
  <div class="jump" id="jump"></div>
</header>
<main id="main"></main>

<button class="addbtn" id="add">＋ 링크 추가</button>
<div class="vw" id="vw" role="dialog" aria-modal="true">
  <div class="stage" id="vstage">
    <span class="scount" id="vcount"></span>
    <button class="snav prev" id="vprev" aria-label="이전 사진">‹</button>
    <div class="imgwrap"></div>
    <button class="snav next" id="vnext" aria-label="다음 사진">›</button>
    <div class="thumbs" id="vthumbs"></div>
  </div>
  <aside id="vside"></aside>
</div>

<script>
/* ===== 프로그램 목록: 여기에 한 줄 추가하면 끝 (slug = programs.sbs.co.kr/radio/○○○) ===== */
const PROGRAMS = [
  {slug:'0chulpowerfm',    name:'김영철의 파워FM',          ig:'sbs.power'},
  {slug:'cinetown11',      name:'박하선의 씨네타운',        ig:'sbscine'},
  {slug:'sbsbigmoney',     name:'박연미의 목돈연구소',      ig:'mokdo_n',        igOnly:true},
  {slug:'sbs12n',          name:'12시엔 주현영',            ig:'sbs12n'},
  {slug:'cultwoshow',      name:'두시탈출 컬투쇼',          ig:'cultwoshow'},
  {slug:'kingcastlepower', name:'황제성의 황제파워',        ig:'kingcastle_power_'},
  {slug:'auditionlife',    name:'인생은 오디션',            ig:'audition1035',   igOnly:true},
  {slug:'lovegame',        name:'박소현의 러브게임',        ig:'lovegame1077'},
  {slug:'sbshungry',       name:'유민상의 배고픈 라디오',   ig:'sbs_hungry'},
  {slug:'wind',            name:'6시 저녁바람 김창완입니다', ig:'windchang1035',  igOnly:true},
  {slug:'wendy0s',         name:'웬디의 영스트리트',        ig:'sbsyoungstreet'},
  {slug:'ten',             name:'배성재의 텐',              ig:'sbs_ten', youtube:'https://www.youtube.com/@Bae_ten/posts'},
];
const DAYS_AHEAD = 13;
const LOOKBACK_DAYS = 30;   // 이 기간 안에 올라온 게시물을 확인
const FAR_DAYS = 31;        // 2주 뒤~한 달 뒤 일정은 "확인 필요"로
const API = 'https://static.apis.sbs.co.kr';
const WD = ['일','월','화','수','목','금','토'];

// 출연·방청 예고로 볼 만한 말
const GUEST_RE  = /예고|게스트|guest|출연|방청|위클리|weekly|주간|초대|라이브|live|특집|스페셜|special|편성|모십니다|모셨|찾아옵|찾아갑|만나요|오십니다|등장|함께합니다|공개방송|공방|출격/i;
// 앞으로의 방송을 알리는 말
const FUTURE_RE = /예고|오십니다|찾아옵|찾아갑|만나요|만나보|모십니다|출격|기대해|예정|옵니다|온대요|함께합니다|함께해요|방청|모집|신청|위클리|weekly|주간|라이브|내일|모레|궁금한\s*점|사연.*남겨/i;
// 방송이 끝난 뒤 올리는 후기 말
const RECAP_RE  = /했어요|했습니다|였어요|였죠|였습니다|였는데|해주셨|와주셨|다녀가|함께했|감사합니다|감사했|고마웠|오셨어요|오셨는데|왔어요|었죠|었어요|봤어요|봤습니다|하셨죠|하셨어요|포착|비하인드|현장|인증샷|기념|지난\s*(?:생방|방송|주)|어제|잘\s*봤|맞췄던|핫했던/;
// 방송 날짜가 아닌 날짜(공연·개봉 기간 등) 옆에 붙는 말
const EVENT_RE  = /부터|까지|개봉|공연|발매|오픈|개최|예매|티켓|마감|출시|전시|콘서트|팬미팅|컴백|생일|D-?\d/i;

/* ---------- 날짜 도우미 (한국시간) ---------- */
const kstFmt = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul'});
const ymdOf = d => kstFmt.format(d);
const today = () => ymdOf(new Date());
const addDays = (ymd,n) => { const d=new Date(ymd+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
const diffDays = (a,b) => Math.round((new Date(a+'T00:00:00Z')-new Date(b+'T00:00:00Z'))/864e5);
const pad = n => String(n).padStart(2,'0');
const wdIdx = ymd => new Date(ymd+'T00:00:00Z').getUTCDay();
// 한 주 = 월~일. 이번 주 월요일 / 그 날짜가 속한 주의 일요일
const weekStart = ymd => addDays(ymd, -((wdIdx(ymd)+6)%7));
const weekEnd   = ymd => addDays(weekStart(ymd), 6);
const ovDates = v => v ? (v.dates || (v.date ? [v.date] : [])) : [];   // 날짜 하나/여러 개 모두 지원
const tsYmd = ts => ymdOf(new Date(ts.replace(/\+0000$/,'Z')));

const DATE_RE = /(20\d{2})\s*[.\/-]\s*(\d{1,2})\s*[.\/-]\s*(\d{1,2})|(?<!\d)(2\d)(0[1-9]|1[0-2])([0-2]\d|3[01])(?!\d)|(\d{1,2})\s*월\s*(\d{1,2})\s*일|(?<![\d.\/:])(\d{1,2})\s*[\/.]\s*(\d{1,2})(?![\d:])/g;
const RANGE_SEP = /^\s*(?:\([^)]*\)|\[[^\]]*\]|[월화수목금토일]요?일?|\s)*\s*[~∼〜\-–]\s*$/;

function findDates(text, refYmd){
  if(!text) return [];
  const t = text.replace(/\s+/g,' '), refY = +refYmd.slice(0,4);
  const hits = []; let r;
  DATE_RE.lastIndex = 0;
  while((r = DATE_RE.exec(t))){
    let y=0,m,d;
    if(r[1]){ y=+r[1]; m=+r[2]; d=+r[3]; }
    else if(r[4]){ y=2000+(+r[4]); m=+r[5]; d=+r[6]; }
    else if(r[7]){ m=+r[7]; d=+r[8]; }
    else { m=+r[9]; d=+r[10]; }
    if(m<1||m>12||d<1||d>31) continue;
    let yy = y || refY, s = `${yy}-${pad(m)}-${pad(d)}`;
    if(!y && diffDays(s, refYmd) < -60) s = `${yy+1}-${pad(m)}-${pad(d)}`;
    const after = t.slice(r.index + r[0].length, r.index + r[0].length + 14);
    const before = t.slice(Math.max(0, r.index - 8), r.index);
    hits.push({s, start:r.index, end:r.index + r[0].length, event: EVENT_RE.test(after.replace(/^[\s)\]]*\(?[월화수목금토일]?\)?/, '').slice(0,8)) || /개봉|공연|발매|생일/.test(before)});
  }
  const out = new Set(), used = new Set();
  for(let i=0;i<hits.length;i++){
    const a = hits[i], b = hits[i+1];
    if(b && RANGE_SEP.test(t.slice(a.end, b.start))){
      const span = diffDays(b.s, a.s);
      if(span>=0 && span<=14 && !b.event){ for(let k=0;k<=span;k++) out.add(addDays(a.s,k)); }
      used.add(i); used.add(i+1); i++; continue;
    }
    if(!used.has(i) && !a.event) out.add(a.s);
  }
  return [...out].sort();
}
function startMin(broad){
  const m = /(오전|오후|저녁|밤|새벽)?\s*(\d{1,2})\s*(?::\s*(\d{2})|시\s*(?:(\d{1,2})\s*분)?)/.exec(broad||'');
  if(!m) return 9999;
  let h=+m[2], mi=+(m[3]||m[4]||0);
  if(/오후|저녁|밤/.test(m[1]||'') && h<12) h+=12;
  return h*60+mi;
}
const fmtTime = mi => mi>=9999 ? '' : `${pad(Math.floor(mi/60))}:${pad(mi%60)}`;
const esc = s => String(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

/* ---------- 저장 (이 기기 전용) ---------- */
const store = {
  get(k,def){ try{ return JSON.parse(localStorage.getItem(k)) ?? def; }catch(e){ return def; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let ocrCache = store.get('ocrCache', {});
let overrides = store.get('overrides', {});

/* ---------- 기기 간 연동 (구글 Apps Script) ---------- */
const SYNC_URL = 'https://script.google.com/macros/s/AKfycbyWFC0vzaAbKPoDMc2rrF4ucckHh9VTRrSPLAi_6MPQN_XAE1Ahak-Ufmd2hFuGf8ki/exec';   // ← 배포한 웹 앱 주소(…/exec)를 여기에 넣으면 모든 기기가 자동 연동
let syncUrl = SYNC_URL || store.get('syncUrl', '');
let syncOk = null;     // null: 미설정, true: 연동됨, false: 오류
let ocrUploaded = false;
let igData = {}, ytData = null, keepData = {};   // 집 PC 확장이 올린 인스타 / 저장소가 읽은 유튜브
async function pullSync(){
  if(!syncUrl) return false;
  try{
    const r = await fetch(syncUrl + (syncUrl.includes('?')?'&':'?') + 'v=2&t=' + Date.now());
    const j = await r.json();
    if(j && typeof j==='object'){
      if(j.overrides){ overrides = j.overrides; igData = j.ig || {}; ytData = j.yt || null; keepData = j.keep || {};
        if(j.ocr){ for(const k in j.ocr) if(!(k in ocrCache)) ocrCache[k] = j.ocr[k];
          // 이 기기가 예전에 읽어 둔 것 중 저장소에 없는 것도 올려 공유
          if(!ocrUploaded){ ocrUploaded = true; for(const k in ocrCache) if(!(k in j.ocr)) ocrNew[k] = ocrCache[k]; shareOcr(); } } }
      else overrides = j;   // 예전 저장소 코드
      store.set('overrides', overrides); syncOk = true; return true;
    }
  }catch(e){ syncOk = false; }
  return false;
}
function pushSync(body){
  if(!syncUrl) return;
  fetch(syncUrl, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)})
    .then(()=>{ syncOk = true; }).catch(()=>{ syncOk = false; setStatus('⚠ 연동 저장 실패 — 이 기기에만 저장됐어요'); });
}
document.addEventListener('visibilitychange', async ()=>{
  if(document.visibilityState==='visible' && progs.length && !loading && await pullSync()){ buildAll(false); saveSnap(); }
});

/* ---------- 상태 ---------- */
let progs = [], selDay = today(), entries = [], unknown = [], ocrQueue = [], ocrBusy = false, workers = [];
const $ = id => document.getElementById(id);
function setStatus(s, frac){
  $('status').textContent = s;
  const pb = $('pbar');
  if(frac==null){ pb.style.display='none'; } else { pb.style.display='block'; pb.firstElementChild.style.width = Math.round(frac*100)+'%'; }

async function getJSON(url){ const r = await fetch(url,{cache:'no-cache'}); if(!r.ok) throw new Error(r.status); return r.json(); }

/* ---------- 불러오기: 저장본 즉시 표시 → SBS·구글 동시에 새로 받기 ---------- */
let rawSbs = store.get('rawSbs', {});      // slug → {meta, posts, at}
let metaCache = store.get('metaCache', {}); // slug → 프로그램 정보 (시간·색·로고, 하루 보관)
let loading = false;

function programList(){
  const extra = Object.values(overrides).filter(v=>v && v.prog && !PROGRAMS.some(x=>x.slug===v.slug))
                     .map(v=>({slug:v.slug, name:v.name||v.slug, ig:v.ig||'', added:true}));
  return [...PROGRAMS, ...extra];
}
async function fetchMeta(p){
  const c = metaCache[p.slug];
  if(c && Date.now()-c.at < 864e5) return c;
  const m = (await getJSON(`${API}/program-api/1.0/menu/${p.slug}`)).program;
  const v = {vodid:m.vodid, broad:m.broaddate, title:m.title, color:m.color, section:m.section,
             logo: m.circleimg ? (m.circleimg.startsWith('//') ? 'https:'+m.circleimg : m.circleimg) : '', at:Date.now()};
  metaCache[p.slug] = v; return v;
}
async function fetchSbs(p){
  try{
    const meta = await fetchMeta(p);
    let posts = [];
    if(!p.igOnly) posts = (await getJSON(`${API}/gorealra-api/instagram/${meta.vodid}.json`)).data || [];
    rawSbs[p.slug] = {meta, posts, at:Date.now()};
  }catch(e){ if(rawSbs[p.slug]) rawSbs[p.slug].err = 'SBS 불러오기 실패'; else rawSbs[p.slug] = {err:'SBS 불러오기 실패', posts:[]}; }
}
function assemble(p){
  const r = rawSbs[p.slug] || {posts:[]}, m = r.meta || {};
  const o = {...p, start:9999, posts:[], err:r.err||'', latest:'', color:'#6b7280', logo:'', ch:''};
  if(m.vodid){
    o.vodid = m.vodid; o.broad = m.broad; o.start = startMin(m.broad);
    if(p.added && m.title) o.name = m.title;
    if(m.color) o.color = m.color;
    o.logo = m.logo || '';
    o.ch = m.section==='PF' ? '파워FM' : m.section==='LF' ? '러브FM' : '';
  }
  o.posts = (r.posts||[]).map(q=>({...q}));
  if(o.posts[0]) o.latest = tsYmd(o.posts[0].timestamp);
  // 인스타 직접 수집분을 합침 (같은 게시물은 SBS 쪽 사진을 우선 — SBS 사진은 만료되지 않음)
  const igd = p.ig && igData[p.ig];
  if(igd && igd.posts){
    o.igAt = igd.at;
    const have = new Set(o.posts.map(postKey));
    for(const q of igd.posts){ if(!have.has(postKey(q))){ o.posts.push({...q, _ig:true}); have.add(postKey(q)); } }
  }
  // 배성재의 텐 유튜브 게시판
  if(p.youtube && ytData && ytData.posts){
    o.ytAt = ytData.at; o.ytErr = ytData.err;
    for(const y of ytData.posts){
      const imgs = (y.imgs||[]).map((u,i)=>({id:'yt_'+y.id+'_'+i, media_type:'IMAGE', media_url:u}));
      o.posts.push({id:'yt_'+y.id, caption:y.text, timestamp:y.pub, _yt:true,
        media_type: imgs.length>1?'CAROUSEL_ALBUM':'IMAGE', media_url: imgs[0] ? imgs[0].media_url : null,
        permalink:'https://www.youtube.com/post/'+y.id, ...(imgs.length>1?{children:{data:imgs}}:{})});
    }
  }
  for(const q of o.posts){ const k = postKey(q); if(k !== String(q.id)) q._oid = String(q.id); q.id = k; }
  // 보관함: 인스타·홈페이지에서 지워졌어도 방송 주가 끝나기 전이면 다시 보여줌
  const have2 = new Set(o.posts.map(q=>q.id));
  for(const id in keepData){
    const k = keepData[id];
    if(k.slug !== p.slug || have2.has(id) || weekEnd(k.until) < today()) continue;
    o.posts.push({...k.post, id, _kept:true, _keepDates:k.dates||{}});
  }
  o.posts.sort((a,b)=>a.timestamp<b.timestamp?1:-1);
  if(o.posts[0]) o.latestAny = tsYmd(o.posts[0].timestamp);
  return o;
}
function buildAll(queue){
  progs = programList().map(assemble).sort((a,b)=>a.start-b.start);
  rebuild(queue, false);
}
function saveSnap(){
  store.set('rawSbs', rawSbs); store.set('metaCache', metaCache);
  store.set('syncSnap', {ig:igData, yt:ytData, keep:keepData});
}
async function loadAll(){
  if(loading) return; loading = true;
  // 1) 저장해 둔 지난 화면을 바로 표시
  if(!progs.length && Object.keys(rawSbs).length){
    const sn = store.get('syncSnap', null);
    if(sn){ igData = sn.ig||{}; ytData = sn.yt||null; keepData = sn.keep||{}; }
    buildAll(false);
    setStatus('최신 내용 불러오는 중…');
  } else setStatus('불러오는 중…');
  // 2) 구글 저장소와 SBS를 동시에
  const syncP = pullSync();
  await Promise.all(programList().map(fetchSbs));
  buildAll(false);                                  // SBS 최신분 먼저 반영
  setStatus('최신 내용 불러오는 중… (연동 자료)');
  await syncP;
  const more = programList().filter(p=>!rawSbs[p.slug]);   // 연동으로 새로 생긴 프로그램
  if(more.length) await Promise.all(more.map(fetchSbs));
  buildAll(true);
  saveSnap();
  loading = false;
  runOcr();
}

// 같은 인스타 게시물은 SBS·인스타 어느 쪽에서 와도 같은 이름(주소 끝부분)으로
function postKey(q){ const m = /instagram\.com\/(?:p|reel|tv)\/([^/?#]+)/.exec(q.permalink||''); return m ? m[1] : String(q.id); }

function slidesOf(post){
  if(post.children && post.children.data){
    const imgs = post.children.data.filter(c=>c.media_type==='IMAGE').map(c=>({id:c.id,url:c.media_url}));
    if(imgs.length) return imgs;
  }
  return [{id:post.id, url: post.media_type==='VIDEO' ? (post.thumbnail_url||post.media_url) : post.media_url}];
}

function classify(p, post, t, queue){
  const posted = tsYmd(post.timestamp);
  if(post._kept){
    const ov0 = overrides[post.id]; if(ov0 && ov0.hide) return;
    const sl = slidesOf(post), x = d => diffDays(d,t);
    for(const [d,st] of Object.entries(post._keepDates)){
      if(d>=weekStart(t) && x(d)<=DAYS_AHEAD) { const ks=Object.keys(post._keepDates).sort(); entries.push({prog:p, post, posted, slides:sl, date:d, start:st.s||0, weekly:!!st.w, manual:!!st.m, range: ks.length>1?[ks[0],ks[ks.length-1]]:null}); }
      else if(x(d)>DAYS_AHEAD && x(d)<=FAR_DAYS) unknown.push({prog:p, post, posted, slides:sl, guess:d, far:true, confirmed:!!st.m});
    }
    return;
  }
  if(diffDays(t, posted) > LOOKBACK_DAYS) return;
  const ov = overrides[post.id] || (post._oid && overrides[post._oid]);
  if(ov && ov.hide) return;
  const slides = slidesOf(post);
  const inWin = d => d >= weekStart(t) && diffDays(d,t) <= DAYS_AHEAD;   // 이번 주 월요일부터 2주 뒤까지
  const inFar = d => { const x=diffDays(d,t); return x>DAYS_AHEAD && x<=FAR_DAYS; };
  const base = {prog:p, post, posted, slides};
  if(ov && ovDates(ov).length){
    for(const d of ovDates(ov)){
      if(inWin(d)) entries.push({...base, date:d, start:0, manual:true});
      else if(inFar(d)) unknown.push({...base, guess:d, far:true, confirmed:true});
    }
    return;
  }

  const cap = post.caption || '';
  const isVideo = post.media_type==='VIDEO' || /\/reel\//.test(post.permalink||'');
  if(isVideo) return;                                   // 영상 클립은 지난 방송분
  // 유튜브 게시판의 [안내] 일정 글은 앞으로의 생.녹 일정표
  const ytSched = post._yt && /안내|생녹|생방|일정|편성/.test(cap);
  const future = ytSched || FUTURE_RE.test(cap);
  if(RECAP_RE.test(cap) && !future) return;             // 방송 후기·기념사진
  const guestish = GUEST_RE.test(cap) || future;

  let capDates = findDates(cap, posted);
  // 유튜브 공지는 "오늘 밤", "내일" 처럼 쓰는 경우가 많음
  if(post._yt && !capDates.length){
    if(/모레/.test(cap)) capDates = [addDays(posted,2)];
    else if(/내일/.test(cap)) capDates = [addDays(posted,1)];
    else if(/오늘|tonight|잠시\s*후|곧/i.test(cap)) capDates = [posted];
  }
  const ocrable = slides.filter(s=>s.url && !/\.(heic|mp4)(\?|$)/i.test(s.url));
  const wantOcr = guestish && ocrable.length>0 && diffDays(t,posted) <= 10 && (capDates.length!==1 || slides.length>1);
  const pending = wantOcr && ocrable.some(s=>!(s.id in ocrCache));
  if(pending && queue) for(const s of ocrable) if(!(s.id in ocrCache) && !ocrQueue.some(q=>q.id===s.id)) ocrQueue.push({...s, ts:post.timestamp});

  const slideDates = slides.map(s=>findDates(ocrCache[s.id]||'', posted));
  const all = new Set(capDates); slideDates.forEach(ds=>ds.forEach(d=>all.add(d)));
  const fut = [...all].filter(inWin).sort();
  if(!fut.length){
    const far = [...all].filter(inFar).sort();
    if(far.length) unknown.push({...base, guess:far[0], guessAll:far, far:true});   // 2주 뒤~한 달 뒤 미리 잡힌 일정
    else if(!all.size && guestish && !pending && diffDays(t,posted)<=4) unknown.push(base);
    return;
  }
  // 앞으로 나온다는 말이 없으면 자동으로 올리지 않고 "확인 필요"로 (찾은 날짜를 같이 보여줌)
  const ocrText = slides.map(s=>ocrCache[s.id]||'').join(' ');
  const futureAll = future || FUTURE_RE.test(ocrText) || (slides.length>1 && all.size>=3);
  if(!futureAll){
    if(diffDays(t,posted)<=10) unknown.push({...base, guess:fut[0], guessAll:[...all].filter(d=>inWin(d)||inFar(d)).sort()});
    return;
  }
  const weekly = slides.length>1 && all.size>=3;
  for(const d of fut){
    let idx = slideDates.findIndex(ds=>ds.length===1 && ds[0]===d);
    if(idx<0) idx = slideDates.findIndex(ds=>ds.length>0 && ds.length<=2 && ds.includes(d));
    const sa = [...all].sort();
    entries.push({...base, date:d, start:Math.max(0,idx), weekly, range: sa.length>1 ? [sa[0], sa[sa.length-1]] : null});
  }
}

let lastSig = '';
const pos = {};   // 카드별로 지금 보고 있는 사진 번호 (화면을 다시 그려도 유지)
const sigOf = () => selDay + '#' + (selDay==='unknown'
  ? unknown.map(e=>e.post.id).join(',')
  : entries.filter(e=>e.date===selDay).map(e=>e.post.id+':'+e.start+':'+e.slides.length).sort().join(','));
function rebuild(queue, force){
  entries=[]; unknown=[];
  const t = today();
  for(const p of progs) for(const post of p.posts) classify(p, post, t, queue);
  for(const k in overrides){
    const v = overrides[k];
    if(!v || !v.link) continue;
    const p = progs.find(x=>x.slug===v.slug); if(!p) continue;
    for(const d of ovDates(v)){
      const x = diffDays(d, t); if(d < weekStart(t) || x>FAR_DAYS) continue;
      const e = {prog:p, post:{id:k, caption:v.note||'직접 추가한 게시물', permalink:v.link, timestamp:new Date(v.t||Date.now()).toISOString()}, slides:[], posted:t, date:d, start:0, link:true};
      if(x<=DAYS_AHEAD) entries.push(e); else unknown.push({...e, guess:d, far:true, confirmed:true});
    }
  }
  // 보관본(원본 삭제됨)은 같은 프로그램·같은 날짜에 새 게시물이 있으면 확인 필요로 옮김
  const fresh = new Set(entries.filter(e=>!e.post._kept).map(e=>e.prog.slug+'|'+e.date));
  entries = entries.filter(e=>{
    if(!e.post._kept || !fresh.has(e.prog.slug+'|'+e.date)) return true;
    if(!unknown.some(u=>u.post.id===e.post.id)) unknown.push({...e, guess:e.date, confirmed:true, replaced:true});
    return false;
  });
  // 보고 있는 날짜의 내용이 그대로면 위쪽 날짜 칸만 고치고 사진은 건드리지 않음
  if(force===false && sigOf()===lastSig) renderDays(); else render();
  if(!ocrBusy) setStatus(`업데이트 ${new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}`);
  if(!ocrBusy) saveKeep();
}

/* 화면에 잡힌 일정을 저장소 보관함에 올림 (원본이 삭제돼도 날짜 지날 때까지 보이게) */
const keepSent = {};
function saveKeep(){
  if(!syncUrl || !syncOk) return;
  const add = {}, t = today();
  const items = [...entries, ...unknown.filter(e=>e.guess && e.far)];
  for(const e of items){
    if(e.link || !e.post || !e.post.permalink || e.post._kept) continue;
    const id = e.post.id, d = e.date || e.guess;
    if(!d || d < weekStart(t)) continue;
    const a = add[id] || (add[id] = {slug:e.prog.slug, until:d, dates:{}, post:null});
    if(d > a.until) a.until = d;
    a.dates[d] = {s:e.start||0, w:e.weekly?1:0, m:(e.manual||e.confirmed)?1:0};
    if(!a.post){
      const q = e.post;
      a.post = {permalink:q.permalink, caption:(q.caption||'').slice(0,1500), timestamp:q.timestamp, media_type:q.media_type,
        media_url:q.media_url, thumbnail_url:q.thumbnail_url, children:q.children, username:q.username,
        _yt:q._yt||undefined, _ig:q._ig||undefined};
    }
  }
  const send = {};
  for(const id in add){
    const sig = add[id].until + '|' + Object.keys(add[id].dates).sort().join(',');
    const old = keepData[id], oldSig = old && (old.until + '|' + Object.keys(old.dates||{}).sort().join(','));
    if(keepSent[id] === sig || oldSig === sig) continue;
    keepSent[id] = sig; send[id] = add[id];
  }
  if(Object.keys(send).length) pushSync({keep:send});
}

const ocrNew = {};   // 이번에 새로 읽은 결과 → 저장소로 공유
function shareOcr(){ const k = Object.keys(ocrNew); if(!k.length) return; const b = {}; k.forEach(x=>{ b[x]=ocrNew[x]; delete ocrNew[x]; }); pushSync({ocr:b}); }
async function runOcr(){
  if(ocrBusy || !ocrQueue.length) return;
  ocrBusy = true;
  ocrQueue.sort((a,b)=>a.ts<b.ts?1:-1);
  const total = ocrQueue.length; let done = 0;
  setStatus(`사진 속 날짜 읽는 중… 0/${total}`, 0);
  try{
    if(!workers.length) workers = await Promise.all([1,2].map(()=>Tesseract.createWorker('kor+eng')));
    await Promise.all(workers.map(async w=>{
      while(ocrQueue.length){
        const s = ocrQueue.shift();
        if(!(s.id in ocrCache)){
          try{ const {data} = await w.recognize(s.url); ocrCache[s.id] = data.text || ''; }
          catch(e){ ocrCache[s.id] = ''; }
          ocrNew[s.id] = ocrCache[s.id];
          store.set('ocrCache', pruneCache(ocrCache));
        }
        done++;
        setStatus(`사진 속 날짜 읽는 중… ${done}/${total}`, done/total);
        if(done%3===0) rebuild(false, false);
        if(done%5===0) shareOcr();
      }
    }));
  }catch(e){ setStatus('사진 글자 읽기를 시작하지 못했어요 — 본문 날짜만 사용 중'); }
  ocrBusy = false;
  shareOcr();
  rebuild(false, false);
}
function pruneCache(c){ const k=Object.keys(c); if(k.length>600) k.slice(0,k.length-600).forEach(x=>delete c[x]); return c; }

/* ---------- 화면 ---------- */
const isBanchung = e => /방청/.test((e.post.caption||'') + e.slides.map(s=>ocrCache[s.id]||'').join(' '));
const ZOOM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5M11 8v6M8 11h6"/></svg>';
let viewList = [];   // 지금 화면에 보이는 게시물 순서 (크게 보기에서 이전/다음으로 넘김)

function render(){

  lastSig = sigOf();
}
function renderDays(){

  const progsOn = d => progs.filter(p=>entries.some(e=>e.date===d && e.prog===p));

const fmd = d => `${+d.slice(5,7)}/${+d.slice(8)}(${WD[wdIdx(d)]})`;
function progPills(p, es){
  const bc = es.some(isBanchung), wk = es.some(e=>e.weekly), sn = p.youtube && es.some(e=>e.post._yt);
  return (bc?'<span class="pill hot">방청</span>':'') + (wk?'<span class="pill week">주간표</span>':'') + (sn?'<span class="pill yt">생.녹</span>':'');
}
// 프로그램 묶음 (로고·시간·이름 + 포스터들)
function grpHTML(p, es, opt={}){
  return `<section class="grp" id="p-${p.slug}" style="--pc:${p.color}">
    <div class="gh">${p.logo?`<img src="${p.logo}" alt="">`:''}<div class="gt">
      <div class="l1"><span class="tm">${fmtTime(p.start)}</span>${opt.pills!==undefined?opt.pills:progPills(p,es)}</div>
      <div class="nm" title="${esc(p.name)}">${esc(p.name)}</div></div></div>
    <div class="tiles">${es.map(e=>tileHTML(e, opt.unknown)).join('')}</div></section>`;
}
function tileHTML(e, isUnknown){
  const k = viewList.push(e) - 1;
  const n = e.slides.length, si = tileIdx(e), s = e.slides[si];
  const up = e.post.timestamp ? tsYmd(e.post.timestamp) : '';
  let rg = '';
  if(isUnknown) rg = e.guess ? `${e.confirmed?'예정':'찾은 날짜'} ${fmd(e.guess)}` : '날짜 없음';
  else if(e.range && e.range[0]!==e.range[1]) rg = `📅 ${fmd(e.range[0])} ~ ${fmd(e.range[1])}`;
  const sn = e.post._yt && e.date ? snipLines(e.post.caption, e.date) : null;
  const bdg = (e.post._kept?'<span class="pill kp" title="원본이 삭제돼서 보관해 둔 내용">보관본</span>':'')
    + (e.replaced?'<span class="pill">대체됨</span>':'') + (isBanchung(e)?'<span class="pill hot">방청</span>':'');
  const g = isUnknown && e.guess && !e.confirmed ? (e.guessAll&&e.guessAll.length?e.guessAll:[e.guess]) : null;
  const pic = e.link
    ? `<div class="pic"><span>📷</span>직접 추가한 게시물</div>`
    : `<div class="pic">${s?`<img loading="lazy" src="${esc(s.url)}" alt="" draggable="false">`:''}
        ${n>1?`<span class="cnt">❐ <b>${si+1}</b>/${n}</span><button class="tnav prev" data-d="-1" aria-label="이전 사진" ${si<=0?'disabled':''}>‹</button><button class="tnav next" data-d="1" aria-label="다음 사진" ${si>=n-1?'disabled':''}>›</button>`:''}${bdg?`<span class="bdg">${bdg}</span>`:''}
        <span class="zoom">${ZOOM}크게 보기</span></div>`;
  return `<div class="tile ${e.link?'link':''}" tabindex="0" data-k="${k}" data-id="${esc(e.post.id)}" style="--pc:${e.prog.color}">
    ${pic}
    <div class="ft">
      ${rg?`<div class="rg">${rg}</div>`:''}
      ${sn?`<div class="sn">${sn.lines.slice(0,4).map(l=>{const m=/^(\d{1,2}:\d{2})\s*(.*)$/.exec(l); return `<div>${m?`<b>${m[1]}</b>${esc(m[2])}`:esc(l)}</div>`;}).join('')}</div>`:''}
      ${up?`<div class="up">올린 날 ${fmd(up)}${e.post._yt?' · 유튜브':''}</div>`:''}
      ${g?`<div class="q"><button class="ok" data-a="ok" data-g="${g.join(',')}">✓ ${g.length>1?`${+g[0].slice(5,7)}/${+g[0].slice(8)}~${+g[g.length-1].slice(5,7)}/${+g[g.length-1].slice(8)}`:`${+g[0].slice(5,7)}/${+g[0].slice(8)}`} 맞음</button><button data-a="hide">숨기기</button></div>`:''}
    </div></div>`;
}

// 타일에서 보고 있는 사진 번호 (다시 그려도 유지)
const tileKey = e => e.post.id + '|' + selDay;
const tileIdx = e => { const n = e.slides.length; const k = tileKey(e); const i = k in pos ? pos[k] : (e.start||0); return Math.max(0, Math.min(n-1, i)); };
function tileGo(tile, d){
  const e = viewList[+tile.dataset.k], n = e.slides.length, i = tileIdx(e) + d;
  if(i<0 || i>=n) return;
  pos[tileKey(e)] = i;
  const img = tile.querySelector('.pic img'); if(img) img.src = e.slides[i].url;
  tile.querySelector('.cnt b').textContent = i+1;
  tile.querySelector('.tnav.prev').disabled = i<=0; tile.querySelector('.tnav.next').disabled = i>=n-1;
  if(e.slides[i+1]) new Image().src = e.slides[i+1].url;   // 다음 장 미리 받아두기
}
function renderMain(){
  const t = today();
  const m = $('main');
  viewList = [];
  if(selDay==='unknown'){
    $('when').textContent = '확인 필요'; $('jump').innerHTML='';
    const wall = list => {
      const out = []; // 같은 프로그램끼리 묶되, 순서는 유지
      for(const e of list){ const last = out[out.length-1]; if(last && last.p===e.prog) last.es.push(e); else out.push({p:e.prog, es:[e]}); }
      return `<div class="wall">${out.map(o=>grpHTML(o.p, o.es, {unknown:true, pills:''})).join('')}</div>`;
    };
    const far = unknown.filter(e=>e.far).sort((a,b)=>a.guess<b.guess?-1:a.guess>b.guess?1:a.prog.start-b.prog.start);
    const near = unknown.filter(e=>!e.far).sort((a,b)=>a.prog.start-b.prog.start);
    m.innerHTML = unknown.length
      ? (near.length?`<h3 class="sec">확인 필요 <small>자동으로 확정하기 애매한 게시물 — 맞으면 <b>✓ 맞음</b>, 아니면 <b>숨기기</b> (사진을 누르면 크게 보여요)</small></h3>${wall(near)}`:'')
        + (far.length?`<h3 class="sec">2주 뒤 ~ 한 달 뒤 미리 잡힌 일정 <small>날짜가 다가오면 해당 날짜 칸으로 자동으로 옮겨가요</small></h3>${wall(far)}`:'')
      : `<div class="empty-msg">확인할 게시물이 없어요 👍</div>`;
    bindTiles(); return;
  }
  const w = wdIdx(selDay);
  $('when').textContent = `${+selDay.slice(5,7)}월 ${+selDay.slice(8)}일 (${WD[w]})${selDay===t?' · 오늘':''}`;
  const list = entries.filter(e=>e.date===selDay);
  const on = progs.filter(p=>list.some(e=>e.prog===p));
  $('jump').innerHTML = on.length>1 ? on.map(p=>`<button data-j="${p.slug}" style="--pc:${p.color}">${p.logo?`<img src="${p.logo}" alt="">`:''}${esc(p.name)}</button>`).join('') : '';
  const html = on.map(p=>grpHTML(p, list.filter(e=>e.prog===p).sort((a,b)=>a.post.timestamp<b.post.timestamp?1:-1))).join('');
  const ten = progs.find(p=>p.youtube);
  m.innerHTML = (html ? `<div class="wall">${html}</div>` : `<div class="empty-msg">${selDay===t?'오늘':'이 날'} 올라온 출연 정보가 없어요</div>`) +
    (ten && !(ten.ytAt && !ten.ytErr) ? `<div class="side" style="margin-top:24px"><h3>배성재의 텐 · 유튜브 <span class="pill yt">생.녹</span></h3><p>유튜브 게시판을 자동으로 읽지 못했어요. <a href="${ten.youtube}" target="_blank" rel="noopener">유튜브 게시판 직접 열기 →</a></p></div>` : '');
  $('jump').querySelectorAll('button').forEach(b=>b.onclick=()=>{ setHH(); document.getElementById('p-'+b.dataset.j).scrollIntoView({behavior:'smooth'}); });
  setHH(); spy();
  bindTiles();
}

// 유튜브 주간 일정 글에서 그날 부분만 꺼냄 ("10/7(수) - 20:00 … - 22:00 …")
function snipLines(text, ymd){
  if(!text) return null;
  const m = +ymd.slice(5,7), d = +ymd.slice(8);
  const re = new RegExp(`(?<![\\d/])0?${m}\\s*[/.]\\s*0?${d}(?!\\d)`);
  const hit = re.exec(text); if(!hit) return null;
  let body = text.slice(hit.index);
  const next = /(?<![\d/])\d{1,2}\s*[\/.]\s*\d{1,2}\s*\(/g; next.lastIndex = hit[0].length;
  const n = next.exec(body); if(n) body = body.slice(0, n.index);
  body = body.replace(/[\u{1F300}-\u{1FAFF}←-⇿⬀-⯿☀-➿️♥♡]/gu,' ').replace(/\s*-\s*(?=\d{1,2}:\d{2})/g,'\n').replace(/[ \t]+/g,' ').trim();
  const lines = body.split('\n').map(x=>x.trim()).filter(x=>x && x!=='-');
  if(lines.length<2) return null;
  return {head:lines[0], lines:lines.slice(1)};
}
function daySnippet(text, ymd){
  const s = snipLines(text, ymd); if(!s) return '';
  return `<div class="snip"><b>${esc(s.head)}</b>${s.lines.map(l=>`<div>${esc(l).replace(/^(\d{1,2}:\d{2})/,'<span class="tm">$1</span>')}</div>`).join('')}</div>`;
}
// '올린 날짜'와 주간표 기간
function dateLine(e){
  const up = e.post.timestamp ? tsYmd(e.post.timestamp) : '';
  const parts = [];
  if(e.range && e.range[0] !== e.range[1]) parts.push(`<b>📅 ${fmd(e.range[0])} ~ ${fmd(e.range[1])}</b>`);
  else if(e.date) parts.push(`<b>📅 ${fmd(e.date)}</b>`);
  else if(e.guess) parts.push(`<b>${e.confirmed?'예정':'찾은 날짜'} ${fmd(e.guess)}</b>`);
  if(up) parts.push(`올린 날 ${fmd(up)}`);
  return parts.length ? `<div class="dl">${parts.join('<span style="opacity:.4">·</span>')}</div>` : '';
}

function bindTiles(){
  document.querySelectorAll('.tile').forEach(tile=>{
    const k = +tile.dataset.k;
    tile.onclick = ev => {
      const nv = ev.target.closest('.tnav');
      if(nv){ ev.stopPropagation(); tileGo(tile, +nv.dataset.d); return; }
      if(tile._swiped && Date.now()-tile._swiped<400) return;
      const b = ev.target.closest('button[data-a]');
      if(b){ ev.stopPropagation(); doAct(tile.dataset.id, b.dataset.a, b.dataset.g); return; }
      openView(k, tileIdx(viewList[k]));
    };
    tile.onkeydown = ev => {
      if(ev.key==='Enter' || ev.key===' '){ ev.preventDefault(); openView(k, tileIdx(viewList[k])); }
      else if(ev.key==='ArrowLeft' || ev.key==='ArrowRight'){ ev.preventDefault(); tileGo(tile, ev.key==='ArrowLeft'?-1:1); }
    };
    // 폰: 타일 사진을 옆으로 쓸어서 넘기기
    let sx=null, sy=null;
    tile.addEventListener('touchstart', ev=>{ sx=ev.touches[0].clientX; sy=ev.touches[0].clientY; }, {passive:true});
    tile.addEventListener('touchend', ev=>{ if(sx==null) return; const dx=ev.changedTouches[0].clientX-sx, dy=ev.changedTouches[0].clientY-sy; sx=null;
      if(Math.abs(dx)>40 && Math.abs(dx)>Math.abs(dy)*1.5){ tile._swiped=Date.now(); tileGo(tile, dx<0?1:-1); } }, {passive:true});
    const img = tile.querySelector('.pic img');
    if(img) img.onerror = () => { img.remove(); tile.querySelector('.pic').insertAdjacentHTML('afterbegin', '<div class="noimg"><span style="font-size:26px">📷</span>사진을 불러오지 못했어요<br>눌러서 보기</div>'); };
  });
}

// 숨기기·날짜 수정 등 (어느 기기에서 해도 연동)
function doAct(id, a, g){
  const now = Date.now();
  if(a==='hide') overrides[id]={hide:true, t:now};
  if(a==='ok') overrides[id]={dates:g.split(','), t:now};
  if(a==='reset' || a==='del') delete overrides[id];
  if(a==='date'){
    const v = prompt('방송 날짜를 입력하세요\n· 하루: 10/14\n· 여러 날: 10/14, 10/16\n· 기간: 11/9~11/14', '');
    if(!v) return false;
    const ds = findDates(v.replace(/[,，、]/g,' , '), today());
    if(!ds.length){ alert('날짜 형식을 확인해 주세요 (예: 10/14 또는 11/9~11/14)'); return false; }
    const old = overrides[id];
    overrides[id] = old && old.link ? {...old, date:undefined, dates:ds, t:now} : {dates:ds, t:now};
  }
  pushSync(overrides[id] ? {set:{[id]:overrides[id]}, ...(a==='hide'?{unkeep:[id]}:{})} : {del:[id]});
  store.set('overrides', overrides); rebuild(false, true);
  return true;
}

/* 위쪽 고정 영역 높이만큼 띄워서 이동 + 지금 보고 있는 프로그램 버튼 강조 */
function setHH(){ document.documentElement.style.setProperty('--hh', (document.querySelector('header').offsetHeight + 12) + 'px'); }
function spy(){
  const secs = [...document.querySelectorAll('.grp')], hh = document.querySelector('header').offsetHeight + 20;
  let curId = secs.length ? secs[0].id : '';
  for(const s of secs) if(s.getBoundingClientRect().top - hh <= 0) curId = s.id;
  $('jump').querySelectorAll('button').forEach(b=>{
    const on = 'p-'+b.dataset.j === curId; b.classList.toggle('on', on);
    if(on && !b._shown){ b.scrollIntoView({block:'nearest', inline:'nearest'}); }
    b._shown = on;
  });
}
addEventListener('scroll', ()=>requestAnimationFrame(spy), {passive:true});
addEventListener('resize', setHH);

/* ---------- 크게 보기 ---------- */
let vK = 0, vI = 0;
const vw = $('vw');
function openView(k, at){
  vK = k; const e = viewList[k]; if(!e) return;
  vI = at!=null ? at : Math.min(e.start||0, Math.max(0, e.slides.length-1));
  if(!vw.classList.contains('on')){ try{ history.pushState({vw:1},''); }catch(_){} }
  vw.classList.add('on'); document.body.style.overflow='hidden';
  drawSide(); drawStage();
}
function hideView(){ vw.classList.remove('on'); document.body.style.overflow=''; $('vstage').querySelector('.imgwrap').innerHTML=''; }
function closeView(){ if(!vw.classList.contains('on')) return; hideView(); if(history.state && history.state.vw){ try{ history.back(); }catch(_){} } }
function drawStage(){
  const e = viewList[vK], n = e.slides.length, wrap = $('vstage').querySelector('.imgwrap');
  if(e.link || !n){
    wrap.innerHTML = `<a class="linkbig" href="${esc(e.post.permalink)}" target="_blank" rel="noopener"><span>📷</span>직접 추가한 게시물<br>눌러서 인스타에서 보기</a>`;
  } else {
    wrap.innerHTML = `<img class="big" src="${esc(e.slides[vI].url)}" alt="" draggable="false">`;
    wrap.querySelector('img').onerror = () => {
      const link = (e.post.permalink||'').replace(/\/?$/,'/');
      wrap.innerHTML = /instagram\.com/.test(link) ? `<iframe src="${link}embed/" loading="lazy"></iframe>` : `<a class="linkbig" href="${esc(e.post.permalink)}" target="_blank" rel="noopener"><span>🖼</span>사진을 불러오지 못했어요<br>눌러서 원본 보기</a>`;
    };
  }
  $('vcount').style.display = n>1 ? '' : 'none';
  $('vcount').textContent = `${vI+1} / ${n}`;
  $('vprev').disabled = vI<=0; $('vnext').disabled = vI>=n-1;
  $('vthumbs').innerHTML = n>1 ? e.slides.map((s,i)=>`<img src="${esc(s.url)}" data-i="${i}" class="${i===vI?'on':''}" alt="">`).join('') : '';
  $('vthumbs').querySelectorAll('img').forEach(im=>im.onclick=()=>{ vI=+im.dataset.i; drawStage(); });
  const on = $('vthumbs').querySelector('.on'); if(on) on.scrollIntoView({block:'nearest', inline:'center'});
}
function drawSide(){
  const e = viewList[vK], p = e.prog, isU = selDay==='unknown';
  const g = isU && e.guess && !e.confirmed ? (e.guessAll&&e.guessAll.length?e.guessAll:[e.guess]) : null;
  vw.style.setProperty('--pc', p.color);
  $('vside').innerHTML = `
    <div class="vh">${p.logo?`<img src="${p.logo}" alt="">`:''}<div class="t"><h2>${esc(p.name)}</h2>
      <div class="m"><span class="tmv">${fmtTime(p.start)}</span>${p.ch?`<span class="pill ch" style="color:#fff;border-color:rgba(255,255,255,.35)">${p.ch}</span>`:''}${isBanchung(e)?'<span class="pill hot">방청</span>':''}${e.weekly?'<span class="pill week">주간표</span>':''}${e.post._yt?'<span class="pill yt">생.녹</span>':''}${e.post._kept?'<span class="pill kp">보관본</span>':''}</div></div>
      <button class="x" id="vx" aria-label="닫기">×</button></div>
    <div class="vb">
      ${dateLine(e)}
      ${e.replaced?'<div class="kept">같은 날짜에 새 게시물이 올라와서 이 보관본은 확인 필요로 옮겼어요</div>':''}
      ${e.post._kept && !e.replaced?'<div class="kept">🗂 원본이 삭제돼서 보관해 둔 내용이에요 (방송 주가 끝나면 정리돼요)</div>':''}
      ${e.post._yt && e.date ? daySnippet(e.post.caption, e.date) : ''}
      <div class="act">
        ${e.post.permalink?`<a class="ig ${e.post._yt?'ytb':''}" href="${esc(e.post.permalink)}" target="_blank" rel="noopener">${e.post._yt?'유튜브에서 보기':'인스타에서 보기'}</a>`:''}
        ${g?`<button class="pri" data-a="ok" data-g="${g.join(',')}">✓ ${g.length>1?`${fmd(g[0])}~${fmd(g[g.length-1])}`:fmd(g[0])} 출연 맞음</button>`:''}
        <button data-a="date">${isU?'날짜 지정':'날짜 수정'}</button>
        ${e.link?'<button data-a="del">삭제</button>':'<button data-a="hide">숨기기</button>'}
        ${e.manual&&!e.link?'<button data-a="reset">자동으로 되돌리기</button>':''}
      </div>
      <div class="cap">${esc(e.post.caption||'')}</div>
    </div>
    <div class="vf"><div class="pn"><button id="vpp">‹ 이전 게시물</button><span>${vK+1} / ${viewList.length}</span><button id="vpn">다음 게시물 ›</button></div></div>
    <div class="hint">← → 사진 넘기기 · ↑ ↓ 게시물 넘기기 · Esc 닫기</div>`;
  $('vx').onclick = closeView;
  $('vpp').disabled = vK<=0; $('vpn').disabled = vK>=viewList.length-1;
  $('vpp').onclick = ()=>postGo(-1); $('vpn').onclick = ()=>postGo(1);
  $('vside').querySelectorAll('.act button').forEach(b=>b.onclick=()=>{ if(doAct(e.post.id, b.dataset.a, b.dataset.g)) closeView(); });
}
function slideGo(d){ const n = viewList[vK].slides.length, k = vI+d; if(k<0||k>=n) return; vI=k; drawStage(); }
function postGo(d){ const k = vK+d; if(k<0||k>=viewList.length) return; openView(k); }
$('vprev').onclick = ev=>{ ev.stopPropagation(); slideGo(-1); };
$('vnext').onclick = ev=>{ ev.stopPropagation(); slideGo(1); };
$('vstage').onclick = ev=>{ if(ev.target.id==='vstage' || ev.target.classList.contains('imgwrap')) closeView(); };
document.addEventListener('keydown', ev=>{
  if(!vw.classList.contains('on')) return;
  if(ev.key==='ArrowLeft') slideGo(-1); else if(ev.key==='ArrowRight') slideGo(1);
  else if(ev.key==='ArrowUp'){ ev.preventDefault(); postGo(-1); } else if(ev.key==='ArrowDown'){ ev.preventDefault(); postGo(1); }
  else if(ev.key==='Escape') closeView();
});
let tx=null, ty=null;
$('vstage').addEventListener('touchstart', ev=>{ tx=ev.touches[0].clientX; ty=ev.touches[0].clientY; }, {passive:true});
$('vstage').addEventListener('touchend', ev=>{
  if(tx==null) return; const dx = ev.changedTouches[0].clientX-tx, dy = ev.changedTouches[0].clientY-ty; tx=null;
  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)) slideGo(dx<0?1:-1);
  else if(dy>90 && Math.abs(dy)>Math.abs(dx)*1.5) closeView();   // 아래로 쓸면 닫기
});
// 폰 '뒤로' 버튼으로 닫기
addEventListener('popstate', ()=>{ if(vw.classList.contains('on')) hideView(); });

/* 상태 화면 */
$('reload').onclick = loadAll;

/* 📷 인스타 수집 — 집 PC 크롬(확장 프로그램 설치된 곳)에서만 버튼이 보이고, 누를 때만 수집 */
function igBtnInit(){
  if(document.documentElement.dataset.igCollector) $('igc').style.display = '';
}
igBtnInit(); setTimeout(igBtnInit, 500);
$('igc').onclick = () => {
  const b = $('igc'); b.disabled = true; b.textContent = '📷 수집 준비…';
  // 인스타 계정이 등록된 모든 프로그램을 수집 (프로필 화면을 직접 여는 방식이라 막히지 않음)
  const need = [...new Set(progs.map(p=>p.ig).filter(Boolean))];
  if(!need.length){ b.disabled=false; b.textContent='📷 인스타 수집'; setStatus('직접 수집할 계정이 없어요 — 모두 SBS 홈페이지에서 받아오고 있어요'); return; }
  window.postMessage({rg:'collect', accounts:need}, '*');
};
window.addEventListener('message', async e => {
  if(e.source !== window || !e.data || e.data.rg !== 'ig') return;
  const m = e.data, b = $('igc');
  if(m.type === 'progress'){
    b.textContent = `📷 ${m.done}/${m.total}`;
    setStatus(`인스타 수집 중… ${m.user==='전송 중' ? '저장소로 보내는 중' : '@'+m.user} (${m.done}/${m.total})`, m.done/m.total);
  }
  if(m.type === 'done'){
    const r = m.result || {}, fails = Object.entries(r.fail || {});
    b.disabled = false; b.textContent = '📷 인스타 수집';
    if(r.busy){ setStatus('이미 수집 중이에요'); return; }
    const msg = `인스타 수집 완료 — 성공 ${(r.ok||[]).length}개` + (fails.length ? ` · 실패 ${fails.length}개 (${fails.map(([u,er])=>'@'+u+': '+er).join(', ')})` : '') + (r.sendErr ? ` · 전송 실패: ${r.sendErr}` : '');
    setStatus(msg);
    if(fails.some(([,er])=>/로그인/.test(er))) alert('인스타 로그인이 필요해요. 이 크롬에서 instagram.com 에 로그인한 뒤 다시 눌러주세요.');
    if(r.sent){ await loadAll(); setStatus(msg); }
  }
});
$('add').onclick = () => {
  const link = (prompt('인스타(또는 유튜브) 게시물 링크를 붙여넣으세요') || '').trim();
  if(!/^https?:\/\//.test(link)) return;
  const list = progs.map((p,i)=>`${i+1}. ${p.name}`).join('\n');
  const n = +prompt('어느 프로그램인가요? 번호를 입력하세요\n\n' + list, '');
  const p = progs[n-1]; if(!p) return;
  const ds = findDates((prompt('방송 날짜\n· 하루: 10/14\n· 여러 날: 10/14, 10/16\n· 기간: 11/9~11/14', '') || '').replace(/[,，、]/g,' , '), today());
  if(!ds.length){ alert('날짜 형식을 확인해 주세요 (예: 10/14 또는 11/9~11/14)'); return; }
  const d = ds[0];
  const note = prompt('메모 (출연자 이름 등, 비워도 돼요)', '') || '';
  const id = 'link_' + Date.now().toString(36);
  overrides[id] = {link, slug:p.slug, dates:ds, note, t:Date.now()};
  pushSync({set:{[id]:overrides[id]}}); store.set('overrides', overrides);
  selDay = diffDays(d, today())<=DAYS_AHEAD ? d : 'unknown';
  rebuild(false, true);
};
$('info').onclick = () => {
  $('when').textContent = '프로그램 상태'; $('jump').innerHTML='';
  const rows = progs.map(p=>{
    const ago = ts => { if(!ts) return ''; const m = Math.round((Date.now()-ts)/6e4); return m<60 ? `${m}분 전` : m<1440 ? `${Math.round(m/60)}시간 전` : `${Math.round(m/1440)}일 전`; };
    const sbs = p.igOnly ? '<span style="color:var(--faint)">홈페이지 없음</span>'
      : p.err ? `<span class="bad">${p.err}</span>`
      : p.latest && diffDays(today(),p.latest)>30 ? `<span class="bad">멈춤 (${p.latest})</span>`
      : `<span class="ok">정상</span> ${p.latest||''}`;
    const ig = p.igAt ? (Date.now()-p.igAt > 6*36e5 ? `<span style="color:var(--warn);font-weight:700">${ago(p.igAt)}</span>` : `<span class="ok">정상</span> ${ago(p.igAt)}`)
      : p.ig ? `<span style="color:var(--warn);font-weight:700">📷 수집 필요</span>` : `<span style="color:var(--faint)">계정 없음</span>`;
    const yt = p.youtube ? `<br>유튜브: ${p.ytErr ? `<span class="bad">${esc(p.ytErr)}</span>` : p.ytAt ? `<span class="ok">정상</span> ${ago(p.ytAt)}` : '<span style="color:var(--warn);font-weight:700">저장소 업데이트 필요</span>'}` : '';
    return `<tr><td><span class="sw" style="background:${p.color}"></span></td><td><b>${fmtTime(p.start)}</b></td><td>${esc(p.name)}<br><small style="color:var(--faint)">@${esc(p.ig||'')}</small></td><td>${p.ch}</td><td>홈페이지: ${sbs}<br>인스타: ${ig}${yt}</td></tr>`;
  }).join('');
  $('main').innerHTML = `<div class="side" style="border-left-color:var(--acc)"><h3>프로그램 상태</h3>
    <table class="st">${rows}</table>
    <h3 style="margin-top:18px">프로그램 추가</h3>
    <p>SBS 홈페이지에서 프로그램 화면을 열고 주소를 붙여넣으세요. (예: programs.sbs.co.kr/radio/<b>cultwoshow</b>/main) 인스타 계정은 있으면 적어주세요.</p>
    <div class="act" style="margin-top:8px">
      <input id="np_url" placeholder="홈페이지 주소" style="flex:2;min-width:220px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)">
      <input id="np_ig" placeholder="인스타 계정 (예: sbs.power)" style="flex:1;min-width:150px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)">
      <button id="np_add" style="color:#fff;background:var(--acc);border-color:var(--acc);font-weight:700">추가</button>
    </div>
    ${progs.filter(p=>p.added).length ? `<p style="margin-top:8px">추가한 프로그램: ${progs.filter(p=>p.added).map(p=>`<b>${esc(p.name)}</b> <button class="np_del" data-s="${p.slug}" style="font-size:11px;border:1px solid var(--line);border-radius:6px;background:none;color:var(--sub);cursor:pointer">삭제</button>`).join(' · ')}</p>` : ''}
    <h3 style="margin-top:18px">기기 간 연동</h3>
    <p>${syncUrl ? (syncOk===false ? '<span class="bad">연동 주소에 접속이 안 돼요</span>' : '<span class="ok">연동됨</span> — 숨기기·날짜 지정이 모든 기기에 똑같이 적용돼요.') : '연동 안 됨 — 숨기기·날짜 지정이 이 기기에만 저장돼요.'}</p>
    ${SYNC_URL ? '' : `<div class="act" style="margin-top:8px"><input id="surl" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(syncUrl)}" style="flex:1;min-width:240px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)"><button id="ssave">연동 주소 저장</button></div>`}
    <div class="act" style="margin-top:10px"><button id="clr">숨기기·날짜 수정 초기화</button><button id="back">← 돌아가기</button></div></div>`;
  $('clr').onclick=()=>{ if(!confirm('숨기기·날짜 수정을 모두 초기화할까요?' + (syncUrl?' (모든 기기에 적용)':''))) return; overrides={}; store.set('overrides',overrides); pushSync({clear:true}); rebuild(false, true); };
  if($('ssave')) $('ssave').onclick=async()=>{
    syncUrl = $('surl').value.trim(); store.set('syncUrl', syncUrl);
    // 이 기기에서 이미 정리한 내용은 연동 저장소로 올려둠
    const local = {...overrides};
    if(syncUrl && await pullSync()){
      const add = {}; for(const k in local) if(!(k in overrides)){ overrides[k]=local[k]; add[k]=local[k]; }
      if(Object.keys(add).length) pushSync({set:add});
      store.set('overrides', overrides);
    }
    $('info').onclick();
  };
  $('back').onclick=render;
  $('np_add').onclick = async () => {
    const raw = $('np_url').value.trim(), ig = $('np_ig').value.trim().replace(/^@/,'').replace(/^https?:\/\/(www\.)?instagram\.com\//,'').replace(/[\/?].*$/,'');
    const m = /radio\/([A-Za-z0-9_\-]+)/.exec(raw) || /^([A-Za-z0-9_\-]+)$/.exec(raw);
    if(!m){ alert('홈페이지 주소를 확인해 주세요.\n예: https://programs.sbs.co.kr/radio/cultwoshow/main'); return; }
    const slug = m[1];
    if(progs.some(p=>p.slug===slug)){ alert('이미 있는 프로그램이에요.'); return; }
    $('np_add').disabled = true; $('np_add').textContent = '확인 중…';
    try{
      const info = (await getJSON(`${API}/program-api/1.0/menu/${slug}`)).program;
      const id = 'prog:' + slug;
      overrides[id] = {prog:true, slug, name:info.title, ig};   // t 없음 = 60일 자동정리 대상 아님
      pushSync({set:{[id]:overrides[id]}}); store.set('overrides', overrides);
      await loadAll(); alert(`'${info.title}' 추가 완료!`); $('info').onclick();
    }catch(e){ alert('SBS 홈페이지에서 이 프로그램을 찾지 못했어요. 주소를 확인해 주세요.'); $('np_add').disabled=false; $('np_add').textContent='추가'; }
  };
  document.querySelectorAll('.np_del').forEach(b=>b.onclick=async()=>{
    if(!confirm('이 프로그램을 목록에서 뺄까요?')) return;
    const id = 'prog:' + b.dataset.s; delete overrides[id];
    pushSync({del:[id]}); store.set('overrides', overrides); await loadAll(); $('info').onclick();
  });
};
loadAll();
</script>
</body>
</html>
